:root{--purple:#7252bb;--deep:#302347;--ink:#272438;--muted:#848093;--line:#ece9f1;--bg:#f7f6fa;--green:#238c73;--orange:#d88d3d;--red:#cc5263;--role:#7252bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.9 Vazirmatn,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}a{color:var(--purple);text-decoration:none}button{border:0}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible{outline:3px solid #ad91e4}h1,h2,h3,p{margin:0}h1{font-size:25px;font-weight:700}h2{font-size:18px}h3{font-size:15px}small,.muted{color:var(--muted)}.en{direction:ltr;unicode-bidi:embed}.hidden{display:none!important}.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 17px;border-radius:9px;background:var(--purple);color:white;transition:background .15s,transform .15s;font-weight:500}.btn:hover{background:#6345a6}.btn.light{background:white;color:var(--ink);border:1px solid var(--line)}.btn.soft{background:#f0eaf9;color:var(--purple)}.btn.danger{background:#fff0f2;color:#b43f52}.btn.small{font-size:12px;padding:5px 11px}.row{display:flex;align-items:center;gap:12px}.between{display:flex;align-items:center;justify-content:space-between;gap:16px}.wrap{flex-wrap:wrap}.stack{display:grid;gap:18px}.card{border:1px solid var(--line);border-radius:15px;background:white;padding:22px;box-shadow:0 3px 10px #30234702}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 9px;font-size:11px;white-space:nowrap;background:#f0eafb;color:#7957b7}.badge.green{background:#e8f6f1;color:#268871}.badge.red{background:#fdecef;color:#c4495e}.badge.orange{background:#fff3e5;color:#ba782d}.badge.gray{background:#f0f1f5;color:#777587}.dot{width:6px;height:6px;background:currentColor;border-radius:100%}.empty{padding:45px 20px;text-align:center;color:var(--muted)}label{display:grid;gap:5px;font-size:12px;font-weight:500}input,select,textarea{width:100%;border:1px solid #e4e0ec;border-radius:8px;background:#fff;padding:9px 11px;color:var(--ink);min-width:0}input:focus,select:focus,textarea:focus{border-color:#9574cb;outline:2px solid #eee5fa}textarea{min-height:95px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.span2{grid-column:1/-1}.notice{background:#fff8ec;border:1px solid #f2e4c6;color:#8c713d;border-radius:9px;padding:11px 15px;font-size:12px}.note{background:#f5f1fb;border-radius:10px;padding:14px;color:#6c5989;font-size:12px}.error{background:#ffedef;color:#b7344c;padding:12px;border-radius:8px}.sectionhead{margin-bottom:18px}.divider{height:1px;background:var(--line);margin:20px 0}.mono{font-variant-numeric:tabular-nums}.linkbtn{background:none;color:var(--purple);padding:0;font:inherit;text-align:right}.pill{border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:white;font-size:12px}.pill.active{background:#eee7f8;border-color:#c5b3e1;color:var(--purple)}

async function formValues(form){let fd=new FormData(form),p={};for(let[k,v]of fd.entries())if(!(v instanceof File))p[k]=v;form.querySelectorAll('input[type=checkbox]').forEach(i=>p[i.name]=i.checked);for(const input of form.querySelectorAll('select[multiple]'))p[input.name]=fd.getAll(input.name);if(fd.has('sourceFindings'))p.sourceFindings=fd.getAll('sourceFindings');const names=[...new Set(['documents',...Array.from(form.querySelectorAll('input[type=file][name^=rowDocuments]'),x=>x.name)])],files=names.flatMap(name=>fd.getAll(name).filter(f=>f instanceof File&&f.size).map(f=>({name,f})));if(files.length>4)throw Error('در هر نوبت حداکثر چهار مستند انتخاب کنید.');for(const name of names)p[name]=[];for(const{name,f}of files){if(f.size>500*1024)throw Error('حجم فایل «'+f.name+'» بیش از ۵۰۰ کیلوبایت است.');if(!['image/png','image/jpeg','application/pdf'].includes(f.type))throw Error('فقط تصویر پی‌ان‌جی، جی‌پی‌جی یا پی‌دی‌اف مجاز است.');const data=await new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=()=>rej(Error('خواندن فایل ناموفق بود.'));reader.readAsDataURL(f)});p[name].push({id:uid('DOC'),name:f.name,type:f.type,size:f.size,data,by:engine.user.id,at:now()})}return p}

const GROUPS=[['inspector','بازرس','ثبت واقعیت میدانی و مستندات'],['consultant','شرکت مشاور سرمایه‌گذاری مسکن','تحلیل، اعتبارسنجی و نظر کارشناسی'],['deputy','معاونت فناوری و مدیریت ساخت گروه','مرجع تصمیم مدیریتی و کلان'],['consultant-admin','ادمین بازرسان مشاور','زیرمجموعه مشاور · مدیریت حساب بازرسان'],['technical','ادمین ساختار','مدیریت ساختار، نسخه فرایند و زیرساخت']];
function rolesFor(g){return g==='deputy'?['deputy',...MANAGERS,'expert']:g==='consultant'?['consultant','admin1']:g==='consultant-admin'?['admin1']:g==='technical'?['cto','admin2']:[g||'deputy']}
function loginUsers(){return engine.db.users.filter(u=>u.role===loginRole&&(loginRole!=='expert'||managerOf(u)===expandedManager))}
function loginHierarchy(){if(group!=='deputy')return '<section id="deputy-access" hidden></section>';return `<section class="access-tree" id="deputy-access" aria-label="دسترسی‌های زیرمجموعه معاونت"><div class="between"><h2>دسترسی‌های زیرمجموعه</h2><small>مدیر را باز کنید؛ سپس حساب را انتخاب کنید.</small></div><button type="button" class="access-leaf ${loginRole==='deputy'?'selected':''}" data-action="login-account" data-id="deputy" aria-pressed="${loginRole==='deputy'}">${icon('shield')}<span>کارتابل معاونت<small>تصمیم نهایی، ابلاغ و بستن پرونده</small></span></button><div class="manager-branches">${MANAGERS.map(m=>{const open=expandedManager===m,team=engine.db.users.filter(u=>u.role==='expert'&&managerOf(u)===m);return `<section class="manager-branch"><button type="button" class="manager-toggle" data-action="login-manager" data-id="${m}" aria-expanded="${open}" aria-controls="team-${m}">${icon('branch')}<span>${ROLES[m].name}<small class="manager-person">${esc(person(m))}</small></span><small>${fa(team.length)} کارشناس</small><b aria-hidden="true">${open?'−':'+'}</b></button><div id="team-${m}" class="manager-children" ${open?'':'hidden'}><button type="button" class="access-leaf ${loginRole===m?'selected':''}" data-action="login-account" data-id="${m}" aria-pressed="${loginRole===m}">${icon('user')}<span>${esc(person(m))}<small>ورود به کارتابل ${ROLES[m].name} · ارجاع به کارشناسان</small></span></button><div class="expert-children">${team.map(u=>`<button type="button" class="access-leaf ${loginUsername===u.username?'selected':''}" data-action="login-account" data-id="${esc(u.id)}" aria-pressed="${loginUsername===u.username}">${icon('user')}<span>${esc(u.name)}<small>${m==='construction'?'فقط رشته '+esc(u.discipline):'فقط کارهای ارجاع‌شده به این کارشناس'}</small></span></button>`).join('')}</div></div></section>`}).join('')}</div><p class="access-hint">انتخاب زیرمجموعه فقط حساب ورود را مشخص می‌کند؛ مجوزها پس از ورود کنترل می‌شوند.</p></section>`}
function consultantAccess(){if(!['consultant','consultant-admin'].includes(group))return '<section id="consultant-access" hidden></section>';return `<section class="access-tree consultant-access" id="consultant-access" aria-label="دسترسی‌های شرکت مشاور"><h2>شرکت مشاور سرمایه‌گذاری مسکن</h2><p class="access-hint">ادمین بازرسان زیرمجموعه مشاور است و فقط حساب و صلاحیت بازرسان را مدیریت می‌کند.</p><button type="button" class="access-leaf ${loginRole==='consultant'?'selected':''}" data-action="login-account" data-id="consultant" aria-pressed="${loginRole==='consultant'}">${icon('book')}<span>کارتابل مشاور<small>معرفی بازرس، برنامه بازدید و نظر کارشناسی</small></span></button><div class="expert-children"><button type="button" class="access-leaf ${loginRole==='admin1'?'selected':''}" data-action="login-account" data-id="admin1" aria-pressed="${loginRole==='admin1'}">${icon('users')}<span>ادمین بازرسان مشاور<small>صدور حساب، فعال‌سازی و پیگیری صلاحیت بازرسان</small></span></button></div></section>`}

function companyLoginForm(){const users=engine.db.users.filter(u=>u.role==='company'),chosen=users.find(u=>u.username===companyLoginUser)||users[0];return `<section class="company-quick" aria-labelledby="company-entry-title"><h2 id="company-entry-title">${icon('building')} ورود شرکت تابعه <small>نام کاربری و رمز عبور</small></h2><form id="company-login-form"><div class="company-login-fields">${select('شرکت تابعه','companyUser',users.map(u=>[u.username,companyName(u.subsidiary)]),chosen?.username)}${field('نام کاربری','username',chosen?.username||'','text',true,'dir="ltr" autocomplete="username"')}${field('گذرواژه','password','demo123','password',true,'dir="ltr" autocomplete="current-password"')}</div><div class="company-login-footer"><button class="btn" type="submit">ورود</button><p>با انتخاب شرکت، نام کاربری نمایشی تکمیل می‌شود. گذرواژهٔ اولیه: <b class="en">demo123</b></p></div><p class="error hidden" id="company-login-error" role="alert"></p></form><p class="company-scope">هر شرکت فقط پرونده‌ها و گزارش‌های مجاز خود را مشاهده می‌کند.</p></section>`}
function loginBackdrop(){return `<div class="login-backdrop" aria-hidden="true"><div class="backdrop-rail">${['grid','audit','search','shield','chart','settings','users'].map(icon).join('')}</div><div class="backdrop-dashboard"><div class="backdrop-head"></div><div class="backdrop-metrics"><i></i><i></i><i></i></div><div class="backdrop-graphs"><svg viewBox="0 0 440 220"><path d="M15 174 84 132 154 151 225 73 294 108 367 47 420 67" fill="none" stroke="#529db2" stroke-width="6"/><path d="M15 190H425" stroke="#c2d1de" stroke-width="2"/></svg><div class="backdrop-bars">${[45,70,55,95,77,115].map(x=>`<i style="height:${x}px"></i>`).join('')}</div></div></div></div>`}
function login(){let roles=rolesFor(group);if(!roles.includes(loginRole))loginRole=roles[0];let users=loginUsers(),chosen=users.find(u=>u.username===loginUsername)||users[0];loginUsername=chosen?.username||'';$('#app').innerHTML=`<main class="login-stage" id="main">${loginBackdrop()}<div class="login"><section class="login-content" aria-label="انتخاب نقش و ورود"><div class="login-topline"><span>دیدبان <i></i> انتخاب فضای کاری</span><span>گروه سرمایه‌گذاری مسکن</span></div><div class="rolecards" aria-label="انتخاب مجموعه دسترسی">${GROUPS.map(([id,label,description])=>`<button type="button" class="rolecard ${group===id?'selected':''}" data-action="login-group" data-id="${id}" aria-pressed="${group===id}" ${['deputy','consultant','consultant-admin'].includes(id)?`aria-expanded="${id==='deputy'?group==='deputy':['consultant','consultant-admin'].includes(group)}" aria-controls="${id==='deputy'?'deputy-access':'consultant-access'}"`:''}><img src="${LOGIN_ART[id]}" width="134" height="134" alt="" decoding="async"><strong>${label}</strong><small>${description}</small>${id==='inspector'&&group==='inspector'&&chosen?.discipline?`<span class="inspector-discipline-tag">مهندس ${esc(chosen.discipline)}</span>`:''}</button>`).join('')}</div>${loginHierarchy()}${consultantAccess()}${roleLoginForm(roles,users,chosen)}${companyLoginForm()}<p class="login-local-note">${icon('lock')} نسخهٔ نمایشی محلی؛ اطلاعات واقعی یا محرمانه وارد نکنید.</p></section><aside class="login-art" style="--building-image:url('${LOGIN_ART.building}')"><div class="login-art-content"><span class="login-art-eyebrow">گروه سرمایه‌گذاری مسکن</span><h1>سامانه بازرسی، کنترل کیفیت و تصمیم‌یار<br><span>گروه سرمایه‌گذاری مسکن</span></h1><p>کنترل یکپارچه از مشاهدهٔ میدانی تا تصمیم کلان<br>چرخهٔ ۲۴ گامی · کنترل دسترسی نقش‌ها</p><div class="login-art-line"></div><small>از واقعیت میدانی، به تصمیمی قابل پیگیری.</small></div><div class="login-art-footer"><span>راهبری بازرسی و کنترل کیفیت</span><span>نسخهٔ ${txt(engine.db.workflowVersion)}</span></div></aside></div></main>`}
const NAV=[['source-projects','پروژه‌های خرداد ۱۴۰۵','building'],['source-reference','منابع و ضوابط','book'],['dashboard','نمای کلی','grid'],['cases','پرونده‌های بازرسی','folder'],['inbox','کارتابل من','inbox'],['programs','برنامه‌های بازدید','calendar'],['reports','گزارش‌های رشته‌ای','audit'],['referrals','ارجاع کار و کارشناسان','branch'],['controls','کنترل پروژه','chart'],['lessons','بانک درس‌آموخته','book'],['qualifications','صلاحیت بازرسان','shield'],['companies','شرکت‌های تابعه','building'],['audit','تاریخچه رویدادها','audit'],['workflow','نقش‌ها و گردش‌کار','branch'],['help','راهنمای سامانه','eye']];
function allowedNav(){const r=engine.user.role;return NAV.filter(([v])=>{if(v==='source-projects')return ['deputy','consultant','construction','pmo','company','cto','inspector'].includes(r)||isTechnicalExpert(engine.user);if(v==='source-reference')return !['admin1','admin2'].includes(r);if(['dashboard','workflow','help'].includes(v))return true;if(v==='cases'||v==='inbox')return !(r==='expert'&&!isTechnicalExpert(engine.user))&&!['pmo','admin1','admin2'].includes(r);if(v==='programs')return !(r==='expert'&&!isTechnicalExpert(engine.user))&&['deputy','construction','expert','consultant','inspector'].includes(r);if(v==='reports')return ['deputy','construction','consultant','inspector','company','cto','development'].includes(r)||isTechnicalExpert(engine.user);if(v==='referrals')return ['deputy','construction','development','pmo','contracts','expert'].includes(r);if(v==='controls')return ['pmo','deputy','consultant'].includes(r);if(v==='lessons')return ['deputy','development','consultant','company','cto','inspector','expert'].includes(r);if(v==='qualifications')return ['consultant','construction','deputy','admin1'].includes(r);if(v==='companies')return r==='cto';if(v==='audit')return ['deputy','consultant','company','cto','admin1','admin2'].includes(r);return false})}
function inboxItems(){return engine.listCases().flatMap(c=>c.status==='Closed'?[]:c.findings.filter(f=>STEP_ROLES[f.nextStep-1]?.includes(engine.user.role)).map(f=>({c,f})))}
function render(){if(!engine?.user){login();return}if(!allowedNav().some(x=>x[0]===view)&&view!=='detail')view='dashboard';const u=engine.user,r=ROLES[u.role],pending=inboxItems().length,nav=allowedNav();document.documentElement.style.setProperty('--role',r.color);$('#app').innerHTML=`<aside class="sidebar" id="sidebar" aria-label="منوی اصلی"><div class="brand"><div class="brandmark">${icon('shield')}</div><div><strong>دیدبان</strong><small>گروه سرمایه‌گذاری مسکن</small></div></div><div class="workspace-label">فضای کاری ${esc(u.role==='company'?companyName(u.subsidiary):'گروه سرمایه‌گذاری مسکن')}</div><nav class="nav">${nav.map(([id,label,ic])=>`<button data-action="nav" data-id="${id}" class="${view===id||(view==='detail'&&id==='cases')?'active':''}" ${view===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span>${id==='inbox'&&pending?`<span class="count">${fa(pending)}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-note">${icon('lock')} دسترسی متناسب با نقش<p style="margin-top:5px">${esc(r.scope)}</p></div><div class="profile between"><div class="row"><div class="avatar" style="background:#ffffff12;color:#d2c3e4">${esc(u.name.replace(/^(مهندس|دکتر|نماینده) /,'')[0])}</div><div style="font-size:11px;color:#eee8f5">${esc(u.name)}<small style="display:block;font-size:9px;color:#9c8bae">${esc(r.name)}</small></div></div><button class="close" data-action="logout" aria-label="خروج از حساب" title="خروج">${icon('logout')}</button></div></div></aside><div class="shell"><header class="topbar"><div class="row">${btn(icon('menu'),'menu','aria-label="باز کردن منو" aria-expanded="false"','light small mobile-menu')}<div class="crumb">سامانه راهبری بازرسی <strong>/ ${esc(view==='detail'?'جزئیات پرونده':NAV.find(x=>x[0]===view)?.[1]||'')}</strong></div></div><form class="global-search" id="search-form">${icon('search')}<input aria-label="جست‌وجو در پرونده‌های مجاز" name="q" placeholder="جست‌وجوی پرونده، پروژه و یافته…" value="${esc(globalQuery)}"></form><div class="toptools"><span class="today">${jalali(now())}</span><span class="localtag">نسخهٔ محلی</span><button class="close" data-action="notifications" aria-label="اعلان‌های کارتابل">${icon('bell')}</button><div class="avatar">${esc(u.name.replace(/^(مهندس|دکتر|نماینده) /,'')[0])}</div></div></header><main class="content motion" id="main" tabindex="-1">${page()}</main></div>`;bindCharts()}
function heading(title,sub,actions=''){return `<div class="pagehead between"><div><h1>${title}</h1><p>${sub}</p></div><div class="row wrap no-print">${actions}</div></div>`}
function page(){try{let content=({'source-projects':sourceProjectPage,'source-reference':sourceReferencePage,dashboard:dashboard,cases:casesPage,inbox:inboxPage,programs:programsPage,reports:reportsPage,referrals:referralsPage,controls:controlsPage,lessons:lessonsPage,qualifications:qualificationsPage,companies:companiesPage,audit:auditPage,workflow:workflowPage,help:helpPage,detail:detailPage}[view]||dashboard)();return content+`<footer class="footer">دیدبان · سامانه راهبری بازرسی، کنترل کیفیت و تصمیم‌یار گروه سرمایه‌گذاری مسکن <span style="margin:0 10px">|</span> ثبت خودکار تاریخچه · بدون حذف فیزیکی · داده‌های نمایشی</footer>`}catch(e){return `<div class="error">${esc(e.message)}</div>`}}

  SUPERVISION_QC: { label: 'نظارت و کنترل کیفیت', color: '#f59e0b', kw: ['نظارت', 'کنترل', 'تست', 'چک‌لیست', 'پذیرش', 'قصور', 'بازرسی'] },

};
function detectRootCategory(text){if(!text||typeof text!=='string')return 'OTHER';const clean=text.toLowerCase();for(const[k,meta]of Object.entries(ROOT_TAXONOMY)){if(meta.kw.some(kw=>clean.includes(kw)))return k}return 'OTHER'}

function filteredCases(){let cs=engine.listCases();return cs.filter(c=>{let f=c.findings,query=(filters.q||'').trim();return(!query||[c.title,c.project,c.id,...f.map(x=>x.code+' '+(x.observation||''))].join(' ').includes(query))&&(!filters.company||c.subsidiary===filters.company)&&(!filters.discipline||f.some(x=>x.discipline===filters.discipline))&&(!filters.status||c.status===filters.status)&&(!filters.severity||f.some(x=>x.severity===filters.severity))&&(!filters.phase||f.some(x=>phaseOf(x.nextStep).start===+filters.phase))&&(!filters.project||c.project===filters.project)&&(!filters.inspector||f.some(x=>x.inspector===filters.inspector))&&(!filters.deadline||(filters.deadline==='late'?f.some(x=>sla(c,x).late):!f.some(x=>sla(c,x).late)))&&(!filters.rootCategory||f.some(x=>detectRootCategory(x.rootCause||x.companyAnalysis?.additionalRootCauses)===filters.rootCategory))&&(!filters.priority||c.priority===filters.priority||(filters.priority==='critical'&&f.some(x=>x.severity==='critical'))&&(!filters.week||Math.floor((new Date()-new Date(c.createdAt))/604800000)===+filters.week))})}
function filtersHtml(){let cs=engine.listCases();return `<details class="no-print" ${Object.keys(filters).length?'open':''}><summary class="linkbtn" style="margin-bottom:16px">${icon('filter')} فیلتر پیشرفته · ${engine.user.role==='deputy'?'۱۰ معیار سازمانی':'محدوده مجاز نقش'} ${Object.keys(filters).length?badge('فعال'):''}</summary><form id="filters-form" class="filters">${field('جست‌وجوی عنوان و کد','q',filters.q||'','search',false)}${select('شرکت تابعه','company',[['','همه شرکت‌های مجاز'],...[...new Set(cs.map(c=>c.subsidiary))].map(x=>[x,companyName(x)])],filters.company,false)}${select('رشته','discipline',[['','همه رشته‌ها'],...DISCIPLINES],filters.discipline,false)}${select('وضعیت پرونده','status',[['','همه وضعیت‌ها'],...STATES.case.map(s=>[s,statusFa(s)])],filters.status,false)}${select('شدت یافته','severity',[['','همه سطوح'],['critical','بحرانی'],['major','مهم'],['minor','جزئی']],filters.severity,false)}${select('فاز چرخه','phase',[['','همه فازها'],...PHASES.map(p=>[p.start,p.name])],filters.phase,false)}${select('پروژه','project',[['','همه پروژه‌ها'],...[...new Set(cs.map(c=>c.project))]],filters.project,false)}${select('بازرس مأمور','inspector',[['','همه بازرسان مجاز'],...[...new Set(cs.flatMap(c=>c.findings.map(f=>f.inspector)).filter(Boolean))].map(id=>[id,person(id)])],filters.inspector,false)}${select('مهلت خدمت','deadline',[['','همه مهلت‌ها'],['late','دارای تأخیر'],['ontime','در مهلت']],filters.deadline,false)}${select('مقوله علت ریشه‌ای','rootCategory',[['','همه مقوله‌ها'],...Object.entries(ROOT_TAXONOMY).map(([k,v])=>[k,v.label]),['OTHER','سایر علل']],filters.rootCategory,false)}<div class="row span2"><button type="submit" class="btn small">اعمال فیلترها</button>${btn('پاک کردن فیلتر','clear-filters','','light small')}</div></form></details>`}
function dashboard(){let cs=filteredCases(),all=engine.listCases(),fs=cs.flatMap(c=>c.findings),critical=fs.filter(f=>f.severity==='critical'&&f.status!=='FindingClosed').length,closed=cs.filter(c=>c.status==='Closed').length,late=cs.filter(c=>c.findings.some(f=>sla(c,f).late)).length;let r=engine.user.role;if(r==='expert'&&!isTechnicalExpert(engine.user))return referralsPage();if(['admin1','admin2','pmo'].includes(r))return specializedDashboard();let action=engine.user.role==='consultant'?btn(icon('plus')+' پرونده جدید','new-case'):btn(icon('download')+' دریافت خروجی','export-menu','','light');return heading('نمای کلی بازرسی','تصویری یکپارچه از وضعیت کیفیت و پیشرفت رسیدگی',action)+`<section class="hero"><div><h2>${esc(engine.user.name)}، خوش آمدید.</h2><p>${critical?`${fa(critical)} یافته بحرانی در محدوده شما نیازمند توجه است.`:'وضعیت پرونده‌های مجاز شما، به‌روز و آماده بررسی است.'} ${fa(inboxItems().length)} مورد در کارتابل شماست.</p></div><div class="row">${btn('مشاهده کارتابل '+icon('arrow'),'nav','data-id="inbox"','soft')}<div class="hero-seal">${icon('shield')}</div></div></section><section class="stats">${stat('پرونده‌های قابل مشاهده',cs.length,'folder','#8862bf','از '+fa(all.length)+' پرونده در محدوده نقش')}${stat('پرونده‌های باز',cs.length-closed,'clock','#c9924a','در جریان چرخه بازرسی')}${stat('یافته‌های بحرانی',critical,'warning','#d16b7d','مسیر سریع · حداکثر ۲۹ روز')}${stat('پرونده‌های بسته',closed,'check','#369f86',fa(cs.length?Math.round(closed/cs.length*100):0)+'٪ از پرونده‌های انتخابی')}</section>${engine.user.role==='deputy'?`<section class="card" style="border-right:4px solid #e11d48;margin-bottom:18px;background:#fff5f5"><div class="between"><h3 style="color:#9f1239;margin:0">کانون‌های توجه و تصمیم‌گیری معاونت</h3><span class="badge" style="background:#e11d48;color:#fff">مسیر سریع و مداخله</span></div><p style="margin:8px 0 0;font-size:12px;color:#4c0519">تعداد <b>${fa(critical)}</b> یافته بحرانی نیازمند تسریع و نظارت عالیه در حوزه شرکت‌های تابعه function subsidiaryHeatmapSvg(cases){
  const subs=['C01','C02','C03','C04','C05','C06','C07','C08','C09','C10','C11','C12'];
  const sevs=['critical','major','minor'];
  const sevLabels={critical:'بحرانی',major:'مهم',minor:'جزئی'};
  const matrix={};
  let maxCount=1;
  subs.forEach(s=>{
    matrix[s]={critical:0,major:0,minor:0};
    const subFs=cases.filter(c=>c.subsidiary===s).flatMap(c=>c.findings);
    subFs.forEach(f=>{
      if(matrix[s][f.severity]!==undefined){
        matrix[s][f.severity]++;
        if(matrix[s][f.severity]>maxCount)maxCount=matrix[s][f.severity];
      }
    });
  });
  const cellW=32,cellH=22,startX=65,startY=32;
  const cells=subs.flatMap((s,col)=>
    sevs.map((sev,row)=>{
      const val=matrix[s][sev];
      const intensity=val?Math.max(0.2,val/maxCount):0.05;
      const fill=sev==='critical'?`rgba(225,29,72,${intensity})`:sev==='major'?`rgba(245,158,11,${intensity})`:`rgba(99,102,241,${intensity})`;
      return `<rect x="${startX+col*(cellW+4)}" y="${startY+row*(cellH+4)}" width="${cellW}" height="${cellH}" rx="4" fill="${fill}" stroke="#e2e8f0" stroke-width="0.5" ${chartEvent('company',s,companyName(s))}>
        <title>${companyName(s)} - ${sevLabels[sev]}: ${fa(val)} مورد</title>
      </rect>
      <text x="${startX+col*(cellW+4)+cellW/2}" y="${startY+row*(cellH+4)+14}" font-size="9" fill="${val?'#0f172a':'#94a3b8'}" text-anchor="middle" font-family="Vazirmatn">${val?fa(val):'۰'}</text>`;
    })
  ).join('');
  const colHeaders=subs.map((s,col)=>
    `<text x="${startX+col*(cellW+4)+cellW/2}" y="${startY-8}" font-size="8.5" fill="#64748b" text-anchor="middle" font-family="Vazirmatn">${companyName(s).replace(/گروه سرمایه‌گذاری مسکن\s*/,'')}</text>`
  ).join('');
  const rowHeaders=sevs.map((sev,row)=>
    `<text x="${startX-10}" y="${startY+row*(cellH+4)+15}" font-size="10" fill="#334155" text-anchor="end" font-family="Vazirmatn">${sevLabels[sev]}</text>`
  ).join('');
  return `<section class="card" style="margin-bottom:20px;overflow-x:auto">
    <div class="between"><div><h3 style="margin:0">نقشه حرارتی عدم‌انطباق‌ها به تفکیک ۱۲ شرکت تابعه</h3><small class="muted">مقایسه تراکم ریسک بر مبنای شدت نقص در سبد شرکت‌ها (کلیک روی هر ستون برای فیلتر)</small></div><span class="badge" style="background:#475569;color:#fff">پایش ۱۲ شرکت</span></div>
    <svg viewBox="0 0 530 125" style="width:100%;min-width:500px;height:125px;margin-top:10px">${colHeaders}${rowHeaders}${cells}</svg>
  </section>`;
}

function deputyExecutiveReports(){if(engine.user.role!=='deputy')return '';const controls=engine.controls(),devControls=controls.filter(c=>c.deviation<0);const lessons=engine.lessons();const programs=engine.db.inspectionPrograms||[],scheduled=programs.filter(p=>!p.revisit);const refs=engine.referrals();const contractsRefs=refs.filter(r=>r.to==='contracts');return `<section class="card" style="margin-bottom:20px;border-top:3px solid #7953b6"><div class="between" style="border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px"><div><h2 style="color:#56338b;margin:0">گزارشات ۴ مدیر زیرمجموعه معاونت</h2><p class="muted" style="margin:4px 0 0;font-size:11px">وضعیت کلان حوزه‌های ساخت، طرح و توسعه، PMO و امور قراردادها</p></div><span class="badge" style="background:#7953b6;color:#fff">دیده‌بان راهبری معاونت</span></div><div class="stats">${stat('مدیریت ساخت (مهندس مهرنوش)',scheduled.length,'calendar','#3b82f6',fa(scheduled.length)+' مأموریت و بازدید فعال')}${stat('طرح و توسعه (خانم مهندس یگانه)',lessons.length,'book','#c9924a',fa(lessons.length)+' درس‌آموخته و تحلیل فرایند')}${stat('دفتر مدیریت پروژه (مهندس گلبو)',controls.length,'chart','#10b981',fa(devControls.length)+' پروژه نیازمند جبران تأخیر')}${stat('امور قراردادها (خانم مهندس رنجبر زاده)',contractsRefs.length,'branch','#ec4899',fa(contractsRefs.filter(r=>!r.closed).length)+' ارجاع حقوقی/مالی در دست اقدام')}</div></section>`}

function charts(cs){let colors=['#8a64be','#c4aedf','#e1d5ed','#b4d3cb','#dfbb90','#d3899a','#8aaacb','#ae9ec6','#409b80'],groups=STATES.case.map((s,i)=>({s,n:cs.filter(c=>c.status===s).length,color:colors[i]})).filter(x=>x.n),total=cs.length;let offset=0;let donut=groups.map(x=>{let length=x.n/(total||1)*289,html=`<circle cx="145" cy="88" r="46" fill="none" stroke="${x.color}" stroke-width="21" stroke-dasharray="${length} ${289-length}" stroke-dashoffset="${-offset}" transform="rotate(-90 145 88)" ${chartEvent('status',x.s,statusFa(x.s))}><title>${statusFa(x.s)}: ${fa(x.n)}</title></circle>`;offset+=length;return html}).join('');let severities=['critical','major','minor'].map((s,i)=>({s,n:cs.flatMap(c=>c.findings).filter(f=>f.severity===s).length,color:['#cb7588','#d9ae79','#a897c6'][i]})),max=Math.max(1,...severities.map(x=>x.n));let weeks=Array.from({length:6},(_,i)=>({week:5-i,n:cs.filter(c=>Math.floor((new Date()-new Date(c.createdAt))/604800000)===5-i).length})),maxW=Math.max(1,...weeks.map(x=>x.n));let points=weeks.map((x,i)=>`${24+i*50},${145-x.n/maxW*105}`);let comps=[...new Set(cs.map(c=>c.subsidiary))].slice(0,8).map(id=>({id,n:cs.filter(c=>c.subsidiary===id).flatMap(c=>c.findings).filter(f=>f.status!=='FindingClosed').length})),maxC=Math.max(1,...comps.map(x=>x.n));let ontime=cs.filter(c=>!c.findings.some(f=>sla(c,f).late)).length,rate=cs.length?Math.round(ontime/cs.length*100):0;
return `<section class="charts" aria-label="پنج نمودار تعاملی"><article class="card chart"><div class="between"><h3>روند تشکیل پرونده</h3><small>شش هفته اخیر</small></div><svg viewBox="0 0 300 190" role="group" aria-label="روند هفتگی تشکیل پرونده">${[40,75,110,145].map(y=>`<path d="M20 ${y}H284" stroke="#eeeaf4" stroke-dasharray="3 4"/>`).join('')}<path d="M${points.join(' L')} L274 145 L24 145Z" fill="#f0e9f8"/><path d="M${points.join(' L')}" fill="none" stroke="#9673c2" stroke-width="2.5"/>${weeks.map((x,i)=>`<g ${chartEvent('week',x.week,fa(x.week)+' هفته قبل')}><circle cx="${24+i*50}" cy="${145-x.n/maxW*105}" r="5" fill="#9470c1" stroke="white" stroke-width="2"/><text x="${24+i*50}" y="${130-x.n/maxW*105}" text-anchor="middle" font-size="10" fill="#9576b5">${fa(x.n)}</text><text x="${24+i*50}" y="176" text-anchor="middle" font-size="9" fill="#a69aaf">${x.week?fa(x.week)+' هفته':'این هفته'}</text><title>${fa(x.n)} پرونده</title></g>`).join('')}</svg><p class="chart-bottom">برای محدودکردن نتایج، نقطهٔ هفته را انتخاب کنید.</p></article><article class="card chart"><div class="between"><h3>وضعیت پرونده‌ها</h3><small>توزیع چرخه</small></div><svg viewBox="0 0 290 190" role="group" aria-label="توزیع وضعیت پرونده‌ها"><circle cx="145" cy="88" r="46" fill="none" stroke="#f0edf5" stroke-width="21"/>${donut}<text x="145" y="89" text-anchor="middle" font-size="29" font-weight="700" fill="#4a395c">${fa(total)}</text><text x="145" y="110" text-anchor="middle" font-size="10" fill="#a090b1">پرونده</text><text x="145" y="171" text-anchor="middle" font-size="10" fill="#97889e">${fa(groups.length)} وضعیت فعال در انتخاب فعلی</text></svg><div class="legend"><span><i class="dot" style="color:#8a64be"></i>در جریان</span><span><i class="dot" style="color:#409b80"></i>بسته‌شده</span></div></article><article class="card chart"><div class="between"><h3>شدت عدم‌انطباق‌ها</h3><small>تمام یافته‌ها</small></div><svg viewBox="0 0 290 190" role="group" aria-label="شدت عدم‌انطباق">${severities.map nt-weight="700" fill="#6c538d">${fa(rate)}٪</text><text x="145" y="134" text-anchor="middle" font-size="10" fill="#a291b2">بدون تأخیر باز</text><g ${chartEvent('deadline','late','دارای تأخیر')}><text x="145" y="177" text-anchor="middle" font-size="11" fill="#bf8391">${fa(cs.length-ontime)} پرونده نیازمند پیگیری مهلت</text></g></svg></article></section>`}

function detailData(){let c=engine.viewCase(selectedCase),f=c.findings.find(f=>f.id===selectedFinding)||c.findings[0];selectedFinding=f?.id;return{c,f}}
function detailPage(){let{c,f}=detailData();if(!f)return empty();let full=['deputy','consultant','company','cto'].includes(engine.user.role),tabs=[['report','گزارش بازرس'],['flow','چرخه ۲۴ گامی'],...(full?[['opinions','نظر و تصمیم'],['company','تحلیل شرکت'],['actions','اقدام اصلاحی'],['letters','مکاتبات'],['verify','راستی‌آزمایی'],['history','تاریخچه']]:[])];if(['development','contracts'].includes(engine.user.role))tabs=[['report',engine.user.role==='development'?'بررسی فرایند، مصالح و ریشه‌ها':'ارجاع قراردادی'],['flow','وضعیت چرخه']];if(!tabs.some(x=>x[0]===detailTab))detailTab='report';let actionRole=STEP_ROLES[f.nextStep-1]?.includes(engine.user.role),locked=c.status==='Closed'||f.status==='FindingClosed';let body={report:()=>reportTab(c,f),flow:()=>flowHtml(f.nextStep),opinions:()=>opinionsTab(c,f),company:()=>companyTab(c,f),actions:()=>actionsTab(c,f),letters:()=>lettersTab(c,f),verify:()=>verifyTab(c,f),history:()=>historyTab(c,f)}[detailTab]();return heading(esc(c.title),esc(companyName(c.subsidiary))+' / '+esc(c.project)+' / '+esc(f.discipline),btn('بازگشت','nav','data-id="cases"','light')+btn(icon('print')+' چاپ','print','','light'))+`<div class="between wrap" style="margin-bottom:17px"><div class="row wrap">${statusBadge(c.status)}${sevBadge(f.severity)}${c.priority==='critical'?badge('مسیر سریع · سقف ۲۹ روز','red'):badge('چرخه عادی · ۸۷ روز','gray')}</div><div class="row no-print">${select('یافته','findingPicker',c.findings.map(f=>[f.id,f.code+' · '+(f.nonconformity||'یافته جدید')]),f.id)}${engine.user.role==='consultant'&&c.status!=='Closed'?btn('یافته جدید','new-finding','','soft small'):''}</div></div><div class="detailgrid"><section><div class="card"><div class="tabs no-print">${tabs.map(([id,l])=>`<button class="pill ${detailTab===id?'active':''}" data-action="detail-tab" data-id="${id}">${l}</button>`).join('')}</div>${inspectorAssignmentHtml(c,f)}${body}</div>${full?closureHtml(c):''}</section><aside><div class="card"><div class="between"><h3>گام فعلی رسیدگی</h3>${badge(fa(f.nextStep)+' از ۲۴')}</div><h2 style="margin:18px 0 8px;color:var(--purple)">${locked?'یافته بسته شده':STEP_NAMES[f.nextStep-1]}</h2><p class="muted" style="font-size:12px">${phaseOf(f.nextStep).name}</p><div class="progress" style="width:100%;height:7px;margin:18px 0"><i style="width:${(f.nextStep-1)/24*100}%"></i></div><small>مسئول: ${STEP_ROLES[f.nextStep-1].map(r=>ROLES[r].name).join(' / ')}</small><div class="divider"></div><div class="between"><small>مهلت فاز / کل چرخه</small><span style="font-size:12px">${jalali(sla(c,f).deadline)}</span></div>${actionRole&&!locked?btn('انجام گام جاری '+icon('arrow'),'advance','','',):!locked?`<div class="note" style="margin-top:16px">این گام در اختیار نقش دیگری است.</div>`:''}${[4,18].includes(f.nextStep)&&['construction','consultant'].includes(engine.user.role)?btn('برنامه‌های بازدید','nav','data-id="programs"','light'):''}</div><div class="card"><h3>وضعیت‌های باز پرونده</h3><div class="checks">${[['crisis','بحران'],['halt','توقف'],['dispute','اختلاف']].map(([k,l])=>`<div class="between"><small>${l}</small>${badge(c[k]?'باز':'ندارد',c[k]?'red':'green')}</div>`).join('')}</div>${['company','deputy'].includes(engine.user.role)&&c.status!=='Closed'?`<div style="margin-top:18px">${btn(engine.user.role==='company'?'ثبت اعتراض':'رسیدگی به وضعیت‌ها','flags','','light small')}</div>`:''}</div><div class="note">نظر مشاور و تصمیم معاونت دو سند مستقل‌اند؛ ثبت یکی جایگزین دیگری نیست.</div></aside></div>`}
function kv(label,value){return `<div><dt>${label}</dt><dd>${txt(value==null||value===''?'ثبت نشده':value)}</dd></div>`}
function attachments(docs){return(docs||[]).map((d,i)=>d.demo?`<span class="attachment">${icon('audit')} ${txt(d.name)} <small>داده نمونه، بدون فایل</small></span>`:`<a class="attachment" download="${esc(d.name)}" href="${safeData(d.data)}">${icon('download')} ${txt(d.name)} · ${fa(Math.ceil(d.size/1024))} کیلوبایت</a>`).join('')||'<small>مستندی ثبت نشده است.</small>'}
function safeData(d){return /^data:(image\/(png|jpeg)|application\/pdf);base64,[a-zA-Z0-9+/=]+$/.test(d||'')?d:'#'}
function reportTab(c,f){if(engine.user.role==='development')return `<div class="notice"><b>بررسی فرایندهای ساخت و مصالح:</b> مشاهدات میدانی، مشخصات الزامی و ریشه نقص برای تولید دانش و تعمیم به شرکت‌های تابعه استخراج می‌شود.</div>${reportReferenceHtml(f)}<div class="between"><h2>گزارش میدانی و فنی</h2>${badge(txt(f.code),'gray')}</div><p class="muted" style="font-size:11px;margin-top:6px">رشته: ${esc(f.discipline)} · وضعیت: ${esc(f.status)} · گام فعلی: ${fa(f.nextStep)}</p><dl class="keygrid">${kv('واقعیت میدانی',f.observation)}${kv('عدم‌انطباق',f.nonconformity)}${kv('الزام نقض‌شده / مشخصات مصالح',f.requirementViolated)}${kv('محل اجرا',f.location)}${kv('معیار پذیرش',f.acceptanceCriteria)}${kv('محصول / فعالیت ساخت',f.productActivity)}${kv('علت مستقیم',f.directCause)}${kv('علت ریشه‌ای',f.rootCause)}</dl><div class="divider"></div><h3>علل سیستمی و ۵ چرای شرکت</h3><p>${txt(f.companyAnalysis?.additionalRootCauses||'هنوز ثبت نشده')}</p><div class="divider"></div>${referralSummary(f)}`;if(engine.user.role==='contracts')return referralSummary(f);let fields={observation:'واقعیت میدانی',nonconformity:'عدم‌انطباق',requirementViolated:'الزام نقض‌شده',location:'محل',measured:'اندازه‌گیری',acceptanceCriteria:'معیار پذیرش',area:'حوزه',productActivity:'محصول / فعالیت',frequency:'فراوانی',impactScope:'دامنه اثر',actionPriority:'اولویت اقدام',workStatus:'وضعیت کار',actualConsequence:'پیامد واقعی',potentialConsequence:'پیامد بالقوه',safetyConsequence:'پیامد ایمنی',impact:'اثر',actionType:'نوع اقدام',referenceType:'نوع مرجع',resources:'منابع',directCause:'علت مستقیم',rootCause:'علت ریشه‌ای'};return `${reportReferenceHtml(f)}<div class="between"><h2>گزارش کامل بازرس</h2>${badge(txt(f.code),'gray')}</div><p class="muted" style="font-size:11px;margin-top:6px">بازرس: ${esc(person(f.inspector))} · ثبت اولیه: ${jalali(f.createdAt)}</p><dl class="keygrid">${Object.entries(fields).map(([k,l])=>kv(l,f[k])).join('')}</dl><div class="divider"></div><h3>مستندات</h3>${attachments(f.documents)}<div class="divider"></div><h3>ارزیابی ریسک</h3>${f.risk?`<p>احتمال ${fa(f.risk.probability)} × اثر ${fa(f.risk.impact)} = <b>${fa(f.risk.score)}</b> ${badge(f.risk.level,f.risk.score>=20?'red':'orange')}</p>`:empty('تحلیل ریسک هنوز ثبت نشده است.')}${(c.visits||[]).length?`<div class="divider"></div><h3>سوابق بازدید</h3><div class="timeline">${c.visits.map(v=>`<div class="timeline-item"><b>${v.revisit?'بازدید رفع نقص':'بازدید میدانی'}</b><p>${txt(v.notes)}</p><small>${stamp(v.at)} · ${esc(person(v.inspector))}</small></div>`).join('')}</div>`:''}${referralSummary(f)}`}
function referralSummary(f){return `<h3>ارجاع‌های مجاز</h3>${(f.referrals||[]).map(r=>`<div class="note" style="margin-top:12px"><b>${esc(r.assignee?person(r.assignee):ROLES[r.to]?.name||r.to)}</b> ${statusBadge(r.status)}<p>${txt(r.reason)}</p><p>${txt(r.managerOpinion?.note||'در انتظار پاسخ')}</p></div>`).join('')||empty('ارجاع تخصصی ثبت نشده است.')}${['deputy','construction'].includes(engine.user.role)?btn('ارجاع تخصصی جدید','refer','','light small'):''}`}
function opinionsTab(c,f){return `<div class="split"><section class="note"><h3>نظر کارشناسی مشاور</h3>${f.expertOpinion?`<p style="margin:12px 0">${txt(f.expertOpinion.summary)}</p><p>پیشنهاد: ${txt(f.expertOpinion.recommendedAction)}</p><small>${esc(person(f.expertOpinion.by))}<br>${stamp(f.expertOpinion.at)}</small><p style="margin-top:10px">کنترل: ${(f.expertOpinion.controls||[]).join('، ')}</p>`:empty('نظر کارشناسی ثبت نشده است.')}</section><section class="note" style="background:#eef5ef"><h3>تصمیم مستقل معاونت</h3>${f.deputyDecision?`<p style="margin:12px 0">${txt(f.deputyDecision.decision)}</p><p>مبنا: ${txt(f.deputyDecision.basis)}</p><p>مهلت: ${jalali(f.deputyDecision.deadline)}</p><small>${esc(person(f.deputyDecision.by))}<br>${stamp(f.deputyDecision.at)}</small>`:empty('تصمیم نهایی هنوز ثبت نشده است.')}</section></div><div class="divider"></div>${referralSummary(f)}`}
function companyTab(c,f){let a=f.companyAnalysis;return `<div class="between"><h3>تحلیل مستقل شرکت ${esc(companyName(c.subsidiary))}</h3>${engine.user.role==='company'&&f.nextStep>=11&&c.status!=='Closed'?btn('تکمیل پنج چرا','five-whys','','soft small'):''}</div><div class="timeline">${a?a.fiveWhys.map((w,i)=>`<div class="timeline-item"><b>چرای ${fa(i+1)}</b><p>${txt(w)}</p></div>`).join(''):empty('تحلیل پنج چرا ثبت نشده است.')}</div>${a?`<div class="note"><h3>علل سیستمی داخلی</h3><p>${txt(a.additionalRootCauses)}</p><small>${esc(person(a.analyst))} · ${stamp(a.at)} · ${a.confirmed?'تأییدشده':'نیازمند بازبینی'}</small></div>`:''}<div class="divider"></div><h3>پاسخ شرکت</h3><p>${txt(f.companyResponse?.summary||'ثبت نشده')}</p>${attachments(f.companyResponse?.documents)}<div class="divider"></div><h3>ارائه تحلیلی به معاونت</h3><p>${txt(f.companyPresentation?.summary||'ثبت نشده')}</p><small>${stamp(f.companyPresentation?.presentedAt)}</small>${f.rootRemediation?`<div class="divider"></div><h3>رفع علت ریشه‌ای</h3><p>${txt(f.rootRemediation.note)}</p>${attachments(f.rootRemediation.documents)}`:''}`}
function actionsTab(c,f){return `<div class="between"><h3>چرخه مستقل اقدام اصلاحی</h3>${engine.user.role==='company'&&c.status!=='Closed'?btn('اقدام جدید','new-action','','soft small'):''}</div>${f.severity==='critical'?'<div class="notice" style="margin-top:15px">مسیر سریع: از گام تصمیم معاونت، اقدام شرکت می‌تواند هم‌زمان با مکاتبه آغاز شود؛ هیچ شرط بستن حذف نمی‌شود.</div>':''}${(f.actions||[]).map(a=>`<div class="statebox"><div class="between"><h3>${txt(a.title)}</h3>${statusBadge(a.status)}</div><p class="muted" style="font-size:12px">مسئول: ${txt(a.assignee)} · مهلت: ${jalali(a.deadline)}</p><p>${txt(a.note)}</p>${attachments(a.docs)}<div style="margin-top:13px">${((engine.user.role==='company'&&['Proposed','Assigned','InProgress','Ineffective'].includes(a.status))||(engine.user.role==='consultant'&&a.status==='Submitted'))&&c.status!=='Closed'?btn('ثبت مرحله بعد اقدام','action-next',`data-id="${esc(a.id)}"`,'light small'):''}</div><small>${(a.history||[]).map(h=>statusFa(h.to)).join(' ← ')}</small></div>`).join('')||empty('اقدام اصلاحی ثبت نشده است.')}`}
function lettersTab(c,f){return `<h3>مکاتبات و پیگیری خودکار تاریخچه</h3>${(f.communications||[]).map(a=>`<article class="statebox"><div class="between"><h3>${txt(a.no)} · ${txt(a.subject)}</h3>${statusBadge(a.status)}</div><p style="font-size:12px">به: ${esc(companyName(a.to))} · ارسال: ${stamp(a.sentAt)}</p><small>پاسخ: ${stamp(a.respondedAt)}</small>${((engine.user.role==='company'&&a.status==='Sent')||(engine.user.role==='deputy'&&['Sent','Delivered','Answered'].includes(a.status)))&&c.status!=='Closed'?`<div style="margin-top:12px">${btn(engine.user.role==='company'?'ثبت دریافت':'ثبت پیگیری','letter-next',`data-id="${esc(a.id)}"`,'light small')}</div>`:''}</article>`).join('')||empty('مکاتبه‌ای ثبت نشده است.')}`}
function verifyTab(c,f){return `${reportReferenceHtml(f)}<h3>راستی‌آزمایی مستندی و میدانی</h3><div class="timeline">${(f.verifications||[]).map(v=>`<article class="timeline-item">${statusBadge(v.result)}<p>${txt(v.note||'در انتظار انجام بازدید')}</p>${attachments(v.documents)}<small>${esc(person(v.by||v.requestedBy))} · ${stamp(v.at)}</small></article>`).join('')||empty('درخواست راستی‌آزمایی ثبت نشده است.')}</div><div class="divider"></div><h3>اثربخشی و تطبیق دو گزارش</h3>${f.effectiveness?`<div class="note">${badge(f.effectiveness.verdict==='Partial'?'نسبی':statusFa(f.effectiveness.verdict),f.effectiveness.verdict==='Effective'?'green':'orange')}<p>${txt(f.effectiveness.note)}</p><p>${txt(f.effectiveness.cross)}</p><small>${esc(person(f.effectiveness.by))} · ${stamp(f.effectiveness.at)}</small></div>`:empty('ارزیابی اثربخشی انجام نشده است.')}<div class="divider"></div><h3>اقدام پیشگیرانه و تعمیم</h3><p>${txt(f.preventive?.note||'ثبت نشده')}</p>`}
function historyTab(c,f){let events=engine.audit().filter(a=>a.entityId===c.id);return `<h3>تاریخچه این پرونده</h3><p class="muted" style="font-size:11px">داده‌های اولیه نمونه‌اند. عملیات شما از زمان اجرای نسخه محلی ثبت می‌شود.</p><div class="timeline">${events.slice().reverse().map(a=>`<article class="timeline-item"><b>${txt(a.event)}</b><p>${txt(a.detail)}</p><small>${esc(person(a.actor))} · ${stamp(a.at)}</small><div>${btn('مشاهده قبل و بعد','audit-detail',`data-id="${esc(a.id)}"`,'light small')}</div></article>`).join('')||empty('هنوز رویدادی روی این پرونده ثبت نشده است.')}</div>`}
function closureHtml(c){let checks=engine.closeChecks(c);return `<section class="card"><div class="between"><h2>دروازه بستن پرونده</h2>${badge(fa(checks.filter(x=>x.ok).length)+' از ۵ شرط',checks.every(x=>x.ok)?'green':'orange')}</div><div class="checks">${checks.map(x=>`<div class="check ${x.ok?'ok':''}">${x.ok?'✓':'○'} ${x.label}</div>`).join('')}</div>${engine.user.role==='deputy'&&c.status!=='Closed'?`<div style="margin-top:18px">${btn('بررسی و بستن قطعی پرونده','close-case','','')}</div>`:''}${c.status==='Closed'?`<p class="muted" style="margin-top:14px">بسته‌شده در ${stamp(c.closedAt)}</p>`:''}</section>`}
function flowHtml(current){return `<div class="flow">${STEP_NAMES.map((name,i)=>`<article class="flow-step ${current&&i+1<current?'done':''} ${current===i+1?'current':''}"><div class="step-number">${fa(i+1)}</div><h3>${name}</h3><p>${STEP_ROLES[i].map(r=>ROLES[r].name).join(' / ')}</p><small>${phaseOf(i+1).name}</small></article>`).join('')}</div>`}
let sourceItemQuery='',sourceItemDiscipline='',sourceItemOffset=0;
const sourceDetailName=type=>({leaf:'متن ریزبند',fragment:'عبارت ناقص منبع','heading-only':'فقط سرفصل؛ ریزمتن ارائه نشده',missing:'بخش ارائه‌نشده'}[type]||'نسخه قدیمی سرفصل');
function sourceFilteredItems(){const q=latin(sourceItemQuery.trim());return SOURCE_ITEMS.filter(x=>(!sourceItemDiscipline||x.discipline===sourceItemDiscipline)&&(!q||latin(x.code+' '+x.title+' '+x.sectionTitle).includes(q)))}
function sourceCatalogueHtml(){const xs=sourceFilteredItems(),offset=Math.min(sourceItemOffset,Math.max(0,Math.ceil(xs.length/25)-1)*25);return `<section class="card" id="source-catalogue"><h2>کتابخانه متن بندهای ارسالی</h2><p>${fa(SOURCE_ITEMS.filter(x=>x.detailLevel==='leaf').length)} ریزبند با متن کامل، ${fa(SOURCE_ITEMS.filter(x=>x.detailLevel==='fragment').length)} عبارت بریده، ${fa(SOURCE_ITEMS.filter(x=>x.detailLevel==='heading-only').length)} سرفصل بدون ریزمتن و یک بخش ارائه‌نشده. بخش ناقص با متن پیشنهادی جایگزین نشده است.</p><form id="source-item-search" class="formgrid">${field('جست‌وجوی کد یا متن بند','itemQuery',sourceItemQuery,'text',false)}${select('رشته سرفصل','itemDiscipline',[['','همه رشته‌ها'],...['سازه','معماری','برق','مکانیک','ایمنی','مدیریتی','مشترک'].map(x=>[x,x])],sourceItemDiscipline,false)}<button class="btn" type="submit">جست‌وجوی بند</button></form><p>${fa(xs.length)} نتیجه؛ نمایش ${fa(xs.length?offset+1:0)} تا ${fa(Math.min(offset+25,xs.length))}</p><div class="tablewrap"><table><thead><tr><th>کد منبع</th><th>متن بند</th><th>دامنه و وضعیت متن</th></tr></thead><tbody>${xs.slice(offset,offset+25).map(x=>`<tr><td><bdi>${txt(x.code)}</bdi></td><td>${esc(x.title)}<small class="project-sub">${esc(x.sectionTitle)}</small>${x.numberingIssue?'<p class="notice">شماره‌گذاری منبع حفظ شده؛ والد اعلامی ۵-۶-۳، شماره ریزبند ۵-۶-۴ است.</p>':''}</td><td>${esc(x.discipline)}<br>${badge(sourceDetailName(x.detailLevel),x.detailLevel==='leaf'?'green':'orange')}</td></tr>`).join('')}</tbody></table></div><div class="row wrap no-print">${offset>0?btn('بندهای قبلی','source-items-prev','','light'):''}${offset+25<xs.length?btn('بندهای بعدی','source-items-next','','light'):''}</div></section>`}
function sourceMandatoryReferenceHtml(){return `<section class="card"><h2>پیوست نقاط بازرسی اجباری</h2><p>${fa(SOURCE_MANDATORY.length)} فعالیت منبع با درجه و گروه‌های مشمول. شناسه‌های داخلی سامانه کد منبع نیستند. دو عنوان «پیوست ت» برای ایمنی و مدیریت کیفیت همان‌طور که در متن آمده‌اند حفظ شده‌اند.</p><div class="tablewrap"><table><thead><tr><th>پیوست / رشته</th><th>فعالیت</th><th>درجه</th>${[1,2,3,4].map(g=>`<th>گروه ${fa(g)}</th>`).join('')}</tr></thead><tbody>${SOURCE_MANDATORY.map(p=>`<tr><td>${esc(p.appendix)} / ${esc(p.discipline)}</td><td>${esc(p.title)}</td><td>${fa(p.grade)}</td>${[1,2,3,4].map(g=>`<td>${p.groups.includes(g)?'الزامی':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="notice">این فهرست، فعالیت‌های اجباری را مشخص می‌کند؛ تعداد محل‌ها، حجم نمونه، مناطق بازدید و شواهد باید در برنامه همان مأموریت ثبت شوند. پیوست اختصاصی سازه در متن ارائه نشده است. متن ده بند تعهد محرمانگی نیز ارائه نشده و ساخته نشده است.</p></section>`}
function sourcePlanHtml(r){if(r.schemaVersion<3)return '<p class="note">این گزارش پیش از ورود ریزبندها و پیوست نقاط ساخته شده است؛ محتوا و منشأ نسخه قبلی بدون تغییر حفظ شده‌اند. برای قالب جدید یک نمونه جدید بسازید.</p>';const s=sourcePlanSummary(r.mandatoryPoints),shared=sourceMandatoryRules(r.discipline,r.classification?.group,true);return `<section class="source-plan"><h3>برنامه نقاط اجباری رشته</h3><p>${esc(r.planScopeNotice)}${r.classification?.demo?' گروه نظارت این نمونه با پارامترهای فرضی محاسبه شده است.':''}</p><div class="source-stat-grid"><div><small>فعالیت اجباری همین رشته</small><strong>${fa(s.activityCount)}</strong></div><div><small>نقاط برنامه / بازدید</small><strong>${s.total==null?'تعیین نشده':fa(s.total)+' / '+fa(s.visited)}</strong></div><div><small>نقاط بازدیدنشده</small><strong>${s.unvisited==null?'تعیین نشده':fa(s.unvisited)}</strong></div><div><small>پوشش نقاط ثبت‌شده</small><strong>${sourcePercent(s.coverage)}</strong></div></div>${r.mandatoryPoints.length?`<div class="tablewrap"><table><thead><tr><th>فعالیت / درجه</th><th>دامنه و واحد نمونه</th><th>تعداد / بازدید</th><th>بازدید مجدد و شواهد</th></tr></thead><tbody>${r.mandatoryPoints.map(p=>`<tr><td>${esc(p.title)}<br>درجه ${fa(p.grade)}</td><td>${txt(p.locations||'ثبت نشده')}<br>${txt(p.unit||'واحد تعیین نشده')}</td><td>${p.total==null?'—':fa(p.total)} / ${p.visited==null?'—':fa(p.visited)}</td><td>${txt(p.reason)}<br>${txt(p.revisitPlan)}<br>${txt(p.evidence)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="notice">${r.discipline==='سازه'?'پیوست اختصاصی نقاط اجباری سازه در پیام موجود نیست؛ صفر بودن ردیف‌ها به معنی نبود الزام نیست.':'ابتدا گروه نظارت باید تعیین شود.'}</p>`}<details><summary>فعالیت‌های مشترک تیم — ایمنی و مدیریت کیفیت (${fa(shared.length)})</summary><p>این الزامات از گروه نظارت استخراج شده‌اند؛ بازرس رشته جایگزین بازرس ایمنی یا مسئول مدیریت کیفیت نیست. پوشش مشترک در عدد پوشش این رشته جمع نشده است.</p><ul>${shared.map(p=>`<li>${esc(p.discipline)}: ${esc(p.title)} — درجه ${fa(p.grade)}</li>`).join('')}</ul></details>${r.classification?`<details><summary>حداقل پوشش و دفعات بازدید گروه ${fa(r.classification.group)}</summary><p>هدف گروه با تحقق واقعی فرق دارد؛ برنامه فاز و حجم نمونه باید تأیید شود.</p><ul>${Object.entries(r.classification.coverage).map(([phase,[coverage,visits]])=>`<li>${SOURCE_PHASES[phase]}: ${fa(coverage)}٪، حداقل ${fa(visits)} بازدید</li>`).join('')}</ul></details>`:''}</section>`}
function sourcePlanFields(r){if(r.schemaVersion<3||!r.mandatoryPoints?.length)return '';return `<details><summary>ماتریس فعالیت‌های اجباری منبع؛ جدا از نقاط ارجاع مشاور</summary><p class="notice">تعداد ردیف‌های فعالیت با تعداد نقاط واقعی یکی نیست. اعداد نامعلوم را خالی بگذارید؛ در سناریو همه ثبت‌ها نمایشی می‌مانند. متن برنامه بازدید مجدد، صدور مأموریت نیست؛ مأموریت مستقل از گردش‌کار اصلی صادر می‌شود.</p>${r.mandatoryPoints.map((p,i)=>`<fieldset class="report-check"><legend>${esc(p.title)} — درجه ${fa(p.grade)}</legend><div class="formgrid">${field('تعداد نقاط برنامه','pointTotal'+i,p.total??'','number',false,'min="0" step="1"')}${field('تعداد نقاط بازدیدشده','pointVisited'+i,p.visited??'','number',false,'min="0" step="1"')}${field('واحد نمونه‌گیری','pointUnit'+i,p.unit,'text',false)}${field('مسئول بازدید','pointAssignee'+i,p.assignee,'text',false)}</div>${field('مکان و دامنه دقیق نقاط','pointLocations'+i,p.locations,'text',false)}${field('دلیل بازدیدنشده یا عدم شمول','pointReason'+i,p.reason,'text',false)}${field('برنامه بازدید مجدد','pointRevisit'+i,p.revisitPlan,'text',false)}${field('شواهد بازدید نقاط','pointEvidence'+i,p.evidence,'text',false)}</fieldset>`).join('')}</details>`}
document.addEventListener('submit',e=>{if(e.target.id==='source-item-search'){e.preventDefault();const fd=new FormData(e.target);sourceItemQuery=fd.get('itemQuery')||'';sourceItemDiscipline=fd.get('itemDiscipline')||'';sourceItemOffset=0;render()}});

function checklistPhotosHtml(r,row){const ds=r.documents.filter(d=>d.rowId===row.id);return `<div class="checklist-photos">${ds.filter(d=>['image/png','image/jpeg'].includes(d.type)).map(d=>`<figure><img src="${safeData(d.data)}" alt="${esc(d.name)} — بند ${esc(row.sourceCode)}" style="max-width:100%;max-height:200px" loading="lazy"><figcaption>${esc(d.name)} · ${txt(row.sourceCode)}</figcaption></figure>`).join('')}${attachments(ds)}</div>`}
function checklistDropdown(discipline,name,value=''){return select('بند چک‌لیست — '+esc(discipline)+' و بندهای مشترک',name,[['','انتخاب از متن چک‌لیست'],...referralChecklistItems(discipline).map(x=>[x.code,x.code+' — '+x.title+(x.detailLevel==='heading-only'?' (فقط سرفصل؛ ریزمتن ارائه نشده)':'')])],value,false)}
function mandatoryReferralHtml(points){return points?.length?`<section class="notice"><h3>نقاط اجباری ارجاع‌شده توسط مشاور</h3>${points.map(p=>`<p><b>${txt(p.sourceCode)} — ${esc(p.title)}</b><br>محل: ${txt(p.location)}<br><small>ارجاع: ${esc(person(p.by))} · ${stamp(p.at)}</small></p>`).join('')}<small>بازرس نمی‌تواند این نقاط را حذف کند؛ عدم امکان بازدید باید با دلیل و برنامه مجدد ثبت شود.</small></section>`:'<p class="notice">هنوز نقطه اجباری توسط مشاور این مأموریت ارجاع نشده است. در مأموریت باز، بازرس می‌تواند بندهای دیگر را از چک‌لیست فراخوانی و پیش‌نویس را تکمیل کند؛ ارسال نهایی منتظر ارجاع مشاور می‌ماند.</p>'}
function mandatoryReferralControl(p){if(engine.user.role!=='consultant'||!REPORT_DISCIPLINES.includes(p.discipline))return '';const c=engine.db.cases.find(c=>c.id===p.caseId),f=c?.findings.find(f=>f.id===p.findingId);if(!c||!f||c.consultant!==engine.user.id||(p.proposedBy&&p.proposedBy!==engine.user.id))return '';if(c.status==='Closed'||f.status==='FindingClosed'||!['Proposed','Issued','Accepted','Completed'].includes(p.status))return '<p class="note">ارجاع نقطه برای این پرونده بسته یا مأموریت غیرفعال مجاز نیست.</p>';if(engine.reports().some(r=>r.programId===p.id&&r.workflowFormVersion===1&&r.status==='Submitted'))return '<p class="note">دامنه گزارش ارسال‌شده قفل است؛ برای ارجاع نقطه تازه، مأموریت جدید لازم است.</p>';if(p.discipline!==f.discipline||p.inspector!==f.inspector||p.project!==c.project||p.subsidiary!==c.subsidiary)return '<p class="note">هویت مأموریت با پرونده منطبق نیست؛ ارجاع نقطه مجاز نیست.</p>';return btn('ارجاع نقطه اجباری از چک‌لیست','assign-mandatory-point',`data-id="${esc(p.id)}"`,'soft')}
function assignMandatoryPointModal(id){const p=engine.programs().find(p=>p.id===id);if(!p)throw Error('مأموریت مجاز نیست.');modal('ارجاع نقطه بازدید اجباری',`<p>${esc(p.project)} · ${esc(companyName(p.subsidiary))} · ${esc(p.discipline)} · ${esc(person(p.inspector))}</p><p>عنوان بند از چک‌لیست ارسالی خوانده می‌شود و قابل ساختن یا تغییر نیست. محل دقیق را مشاور ثبت می‌کند؛ هر بند در چند محل می‌تواند چند نقطه مستقل باشد.</p>${mandatoryReferralHtml(p.mandatoryInspectionPoints)}${checklistDropdown(p.discipline,'sourceCode')}${field('محل دقیق نقطه بازدید','location')}`,v=>engine.assignMandatoryInspectionPoint(id,v),'ارجاع نقطه به همین مأموریت')}
async function addChecklistItemFromEditor(el){const button=el,form=button.closest('form');button.disabled=true;try{const r=engine.reports().find(r=>r.id===el.dataset.id),p=await formValues(form);if(!p.additionalChecklistCode)throw Error('یک بند از پنجره کشویی انتخاب کنید.');engine.saveSourceReport(r.id,{...sourceReportPayload(r,p),submit:false,additionalChecklistCode:p.additionalChecklistCode});closeModal();render();editSourceReportModal(engine.reports().find(x=>x.id===r.id));const fields=document.querySelectorAll('#modal-form fieldset.report-check');fields[fields.length-1]?.scrollIntoView({block:'start'});}catch(err){const box=document.querySelector('#form-error');if(box){box.textContent=err.message;box.classList.remove('hidden');box.scrollIntoView({block:'nearest'})}else toast(err.message);button.disabled=false}}

function inspectorEntryHtml(p){if(engine.user.role!=='inspector'||p.inspector!==engine.user.id||!REPORT_DISCIPLINES.includes(p.discipline))return '';try{inspectorEntryContext(engine,p.id)}catch(e){return `<p class="note">${esc(e.message)}</p>`}const r=engine.reports().findLast(r=>r.programId===p.id&&r.workflowFormVersion===1),c=engine.db.cases.find(c=>c.id===p.caseId),f=c.findings.find(f=>f.id===p.findingId);if(r?.status==='Draft'||r?.receiptReview?.status==='NeedsCorrection'&&!r.workflowLink||!r||r.workflowLink&&f.nextStep>(p.revisit?20:7))return btn(r?.receiptReview?.status==='NeedsCorrection'?'اصلاح چک‌لیست و گزارش برگشتی مشاور':r?.status==='Draft'?'ادامه تکمیل چک‌لیست و گزارش تحلیلی':f.nextStep>(p.revisit?20:7)?'تکمیل چک‌لیست و گزارش تحلیلی تکمیلی':'تکمیل چک‌لیست و گزارش تحلیلی','start-inspector-report',`data-id="${esc(p.id)}"`,'soft');return `<p class="note">این نسخه ارسال‌شده و قفل است؛ ${r.receiptReview?.status==='NeedsCorrection'?'در صفحه گزارش نسخه اصلاحی بسازید.':'برای تغییر، مشاور باید درخواست اصلاح ثبت کند.'}</p>${btn('پیگیری گزارش ارسال‌شده','open-report',`data-id="${esc(r.id)}"`,'light')}`}
function inspectorAssignmentHtml(c,f){if(engine.user.role!=='inspector')return '';const p=engine.programs().findLast(p=>p.caseId===c.id&&p.findingId===f.id&&['Issued','Accepted','Completed'].includes(p.status));return p?`<section class="notice no-print"><b>ارجاع مشاور: ${esc(person(p.proposedBy||c.consultant))}</b><p>${txt(p.purpose||'شرح مأموریت در برنامه بازدید ثبت شده است.')}</p><div class="row wrap">${inspectorEntryHtml(p)}</div><small>ذخیره پیش‌نویس، گام پرونده را تغییر نمی‌دهد. تحلیل و علت ریشه‌ای پیشنهادی بازرس مستقل از تأیید شرکت و نظر مشاور است.</small></section>`:''}
function inspectorWorkPanel(){if(engine.user.role!=='inspector')return '';const ps=engine.programs().filter(p=>{try{inspectorEntryContext(engine,p.id);return REPORT_DISCIPLINES.includes(p.discipline)}catch{return false}}).sort((a,b)=>{const step=p=>engine.db.cases.find(c=>c.id===p.caseId).findings.find(f=>f.id===p.findingId).nextStep;return step(a)-step(b)});return `<section class="card no-print" style="margin:18px 0"><h2>ارجاع‌های من — تکمیل فرم بازرسی</h2><p>از مأموریت خود وارد شوید، بندهای مرتبط را انتخاب کنید و نتیجه، تحلیل و علل را بنویسید.</p><div class="listcards">${ps.map(p=>`<article class="report-check"><h3>${esc(p.project)} · ${esc(p.discipline)}</h3><p>${esc(companyName(p.subsidiary))} · مشاور: ${esc(person(p.proposedBy||engine.db.cases.find(c=>c.id===p.caseId)?.consultant))}</p><p>${txt(p.purpose)}</p>${inspectorEntryHtml(p)}</article>`).join('')||empty('هنوز مأموریت فعال منطبق با رشته شما صادر نشده است؛ مشاور باید برنامه را ارجاع دهد و مدیر ساخت آن را تأیید کند.')}</div></section>`}

let reportFilters={};
function reportFilterHtml(rs){const options=k=>[...new Set(rs.map(r=>r[k]))].map(v=>[v,k==='subsidiary'?companyName(v):k==='inspector'?person(v):v]);return `<form id="report-filters" class="card formgrid" style="margin-top:18px">${[['subsidiary','شرکت تابعه'],['project','پروژه'],['inspector','بازرس'],['discipline','رشته']].map(([k,title])=>select(title,k,[['','همه موارد مجاز'],...options(k)],reportFilters[k]||'',false)).join('')}<button type="submit" class="btn">نمایش گزارش‌های انتخاب‌شده</button>${btn('پاک‌کردن فیلتر گزارش','clear-report-filters','','light')}</form>`}
function reportResultInputs(row,i){return `<fieldset class="report-result"><legend>نتیجه این بند — فقط یک گزینه</legend><div class="row wrap">${Object.entries(SOURCE_CODES).map(([code,title])=>`<label><input type="radio" name="code${i}" value="${code}" data-report-result="${i}" ${row.code===code?'checked':''}>${title} <bdi>${code}</bdi></label>`).join('')}</div></fieldset>${check('نتیجه و دلیل این بند را بررسی و تأیید کردم','reviewed'+i,row.reviewed===true)}`}
function reportScopeModal(id){const r=engine.reports().find(r=>r.id===id);if(!r)throw Error('گزارش مجاز نیست.');const selected=new Set(r.rows.filter(x=>!x.mandatoryPointId).map(x=>x.sourceCode));modal('انتخاب بندهای دیگر از چک‌لیست رشته',`${mandatoryReferralHtml(r.mandatoryReferral?.points)}<p>فقط متن چک‌لیست ارسالی قابل انتخاب است. نقاط اجباری بالا ثابت می‌مانند. برای افزودن تک‌به‌تک، از پنجره کشویی داخل فرم استفاده کنید.</p><label>بندهای انتخابی بازرس از چک‌لیست<select name="codes" multiple size="12">${referralChecklistItems(r.discipline).map(x=>`<option value="${esc(x.code)}" ${selected.has(x.code)?'selected':''}>${esc(x.code+' — '+x.title+(x.detailLevel==='heading-only'?' (فقط سرفصل)':''))}</option>`).join('')}</select></label>${area('مبنای انتخاب یا کنارگذاشتن بندهای بازرس','reason',r.scopeSelection?.reason||'')}`,p=>engine.configureReportScope(id,{codes:p.codes||[],reason:p.reason}),'ثبت بندهای انتخابی؛ حفظ نقاط مشاور')}
function reportWorkflowPanel(r){const c=engine.db.cases.find(c=>c.id===r.caseId),f=c?.findings.find(f=>f.id===r.findingId),own=engine.user.role==='inspector'&&engine.user.id===r.inspector,reviewer=engine.user.role==='consultant'&&c?.consultant===engine.user.id,review=r.receiptReview,closed=c?.status==='Closed'||f?.status==='FindingClosed';return `<section class="report-workflow-panel"><h3>${r.formPurpose==='supplementary'?'گزارش تکمیلی مستقل همان ارجاع':'فرم مستقل این بازرس و مأموریت'}</h3>${r.formPurpose==='supplementary'?'<p class="notice">این گزارش به سوابق پرونده افزوده می‌شود؛ گزارش قبلی، واقعیت‌ها، علل تأییدشده، نظر مشاور و تصمیم معاونت بازنویسی نمی‌شوند.</p>':''}<p>نسخه ${fa(r.revisionNumber||1)} · ${r.scopeConfirmed||r.phaseConfirmed?'بندهای چک‌لیست تأیید شده‌اند':'بندها باید از چک‌لیست فراخوانی و پیش از ارسال تأیید شوند.'}</p><ol><li>بازرس: انتخاب بند مرتبط، تیک نتیجه، امتیاز مستقل، مشاهده، محل و شاهد.</li><li>ارسال و قفل نسخه؛ کنترل کامل‌بودن توسط مشاور مسئول.</li><li>اتصال با اقدام بازرس به گام ۷؛ عدم‌انطباق، ریسک و علل در گام‌های بعدی. گزارش بازدید مجدد به گام ۲۰ وصل می‌شود.</li><li>نظر کارشناسی مشاور در گام ۱۲ و تصمیم معاونت در گام ۱۳ جدا ثبت می‌شوند؛ پنج چرا، اصلاح، راستی‌آزمایی و شروط بستن حذف نشده‌اند.</li></ol><p class="notice">قالب دیجیتال بر پایه متن قبلی شماست. فایل «فرم گزارش خام.pdf» در این محیط خوانده نشده؛ تطابق صفحه‌آرایی با آن تأیید نشده است.</p>${review?`<p><b>کنترل کامل‌بودن فرم:</b> ${review.status==='Accepted'?'قابل ارجاع به گردش‌کار':'نیازمند اصلاح'} · ${esc(person(review.by))} · ${stamp(review.at)}<br>${txt(review.note)}<br>این ثبت، نظر کارشناسی گام ۱۲ یا تصمیم معاونت نیست.</p>`:'<p>کنترل کامل‌بودن مشاور هنوز ثبت نشده است.</p>'}${r.workflowLink?`<p>متصل به گام ${fa(r.workflowLink.step)}؛ هیچ گامی خودکار طی نشده است.</p>`:''}<div class="row wrap no-print">${own&&!r.workflowFormVersion?inspectorEntryHtml(engine.db.inspectionPrograms.find(p=>p.id===r.programId)):""}${own&&!closed&&r.status==='Draft'?btn('انتخاب و تأیید بندهای مرتبط','report-scope',`data-id="${esc(r.id)}"`,'soft'):''}${reviewer&&!closed&&r.status==='Submitted'&&!review?btn('کنترل کامل‌بودن / درخواست اصلاح','report-receipt',`data-id="${esc(r.id)}"`,'soft'):''}${own&&!closed&&review?.status==='NeedsCorrection'&&!engine.reports().some(x=>x.revisionOf===r.id)?btn('ساخت نسخه اصلاحی مستقل','report-revise',`data-id="${esc(r.id)}"`,'soft'):''}${own&&!closed&&r.status==='Submitted'&&review?.status==='Accepted'&&!r.workflowLink?btn('اتصال گزارش به گردش‌کار','report-link',`data-id="${esc(r.id)}"`):''}${btn('پرونده و فرایند مرتبط','open-case',`data-id="${esc(r.caseId)}" data-fid="${esc(r.findingId)}"`,'light')}</div>${r.revisionOf?`<small>نسخه قبلی ${txt(r.revisionOf)} بدون تغییر حفظ شده است.</small>`:''}${r.excludedRows?.length?`<details><summary>بندهای کنارگذاشته‌شده با سابقه (${fa(r.excludedRows.length)})</summary>${r.excludedRows.map(x=>`<p>${txt(x.row.sourceCode)} — ${txt(x.reason)} · ${stamp(x.at)}</p>`).join('')}</details>`:''}</section>`}
function reportReferenceHtml(f){const ids=[f.reportInputSource?.reportId,...(f.revisitReportSources||[]).map(x=>x.reportId),...(f.supplementaryReportSources||[]).map(x=>x.reportId)].filter(Boolean),rs=engine.reports().filter(r=>ids.includes(r.id));return rs.length?`<div class="notice">گزارش‌های مرجع متصل به این یافته؛ اتصال به معنای تأیید یا بستن نیست.<div class="row wrap">${rs.map(r=>btn('فرم '+esc(r.discipline)+' — نسخه '+fa(r.revisionNumber||1),'open-report',`data-id="${esc(r.id)}"`,'light small')).join('')}</div></div>`:''}
document.addEventListener('submit',e=>{if(e.target.id==='report-filters'){e.preventDefault();reportFilters=Object.fromEntries(new FormData(e.target));selectedReport=null;render()}});
document.addEventListener('change',e=>{const i=e.target.dataset.reportResult;if(i===undefined)return;const form=e.target.form,skipped=['Z','NA'].includes(e.target.value);const reviewed=form.elements.namedItem('reviewed'+i);if(reviewed)reviewed.checked=true;if(skipped)for(const name of ['score','level']){const control=form.elements.namedItem(name+i);if(control)control.value=''}});

function sourceDemoModal(projectId){modal('چهار گزارش نمونه بر مبنای پروژه منبع',`<div class="notice">نام و درصد پروژه از متن ارسالی است. بازدید، پذیرش مأموریت، یافته‌ها، امتیازها و پارامترهای طبقه‌بندی همگی شبیه‌سازی می‌شوند؛ هیچ تأیید واقعی به اشخاص نسبت داده نمی‌شود. برنامه و انحراف ناموجود خالی می‌مانند.</div>${select('پروژه جدول خرداد ۱۴۰۵','sourceProjectId',sourceProjectOptions(),projectId||'SRC-C03-010')}`,p=>{const result=engine.createSourceDemoReports(p.sourceProjectId);selectedReport=result.ids[0];view='reports'},'ساخت چهار نمونه مستقل')}
document.addEventListener('submit',e=>{if(e.target.id==='source-search'){e.preventDefault();sourceQuery=new FormData(e.target).get('query')||'';render()}});
function sourceProjectPage(){const projects=engine.sourceProjects(),q=sourceQuery.trim(),xs=projects.filter(p=>(p.project+' '+companyName(p.subsidiary)).includes(q));return heading('پروژه‌های خرداد ۱۴۰۵','ثبت مرجع با شناسه مستقل شرکت + پروژه',engine.user.role==='consultant'?btn('ساخت گزارش چهاررشته‌ای از جدول','source-demo'):'')+`<section class="hero"><div><h2>دادهٔ پروژه، جدا از نظر بازرس</h2><p>${fa(projects.length)} پروژه در محدوده دسترسی شما · پیشرفت اعلامی، بدون برنامه ساختگی</p></div><div class="hero-seal">${icon('building')}</div></section><div class="notice">${SOURCE_NOTICE}<br>تمام ستون‌های ارائه‌شده برای ${fa(SOURCE_PROJECTS.length)} پروژه ثبت شده‌اند. دو مساحت در ${fa(SOURCE_PROJECTS.filter(p=>p.reportedBuiltArea!==null).length)} ردیف تفکیک شده؛ فقط عبارت مبهم گلشهر و علامت‌های نامشخص منبع خالی‌اند. ترتیب ستون‌های مساحت تغییر نکرده و اصل PDF مستقلاً بررسی نشده است.</div><section class="card" style="margin-top:20px"><form id="source-search" class="row wrap">${field('جست‌وجوی نام شرکت یا پروژه','query',sourceQuery,'text',false)}<button class="btn" type="submit">جست‌وجو</button></form><div class="tablewrap"><table><thead><tr><th>پروژه / شرکت</th><th>وضعیت منبع</th><th>پیشرفت اعلامی</th><th>مشخصات ثبت‌شده</th><th>عملیات</th></tr></thead><tbody>${xs.map(p=>`<tr><td><b>${esc(p.project)}</b><small class="project-sub">${esc(companyName(p.subsidiary))} · ${txt(p.id)}</small></td><td>${esc(p.executionStatus||'نامشخص')}</td><td>${sourcePercent(p.actualProgress)}<div class="source-meter" aria-hidden="true"><i style="width:${p.actualProgress}%"></i></div></td><td><details><summary>مشاهده داده و ابهام</summary><dl>${kv('مساحت ساخته؛ مطابق ترتیب متن',p.reportedBuiltArea==null?'مبهم در متن':fa(p.reportedBuiltArea))}${kv('مساحت زمین؛ مطابق ترتیب متن',p.landArea==null?'مبهم در متن':fa(p.landArea))}${kv('شروع',p.actualStart?fa(p.actualStart):'نامشخص در متن')}${kv('پایان برنامه‌ای',p.plannedFinish?fa(p.plannedFinish):'نامشخص در متن')}${kv('پیشرفت برنامه‌ای','در داده موجود نیست')}${kv('کنترل کیفیت داده',p.issues.join('؛ ')||'اصل سند بررسی نشده')}</dl></details></td><td>${engine.user.role==='consultant'&&p.executionStatus==='در حال اجرا'?btn('نمونه چهار رشته','source-demo',`data-id="${esc(p.id)}"`,'soft small')+btn('پرونده مستقل جدید','source-case',`data-id="${esc(p.id)}"`,'light small'):'—'}</td></tr>`).join('')}</tbody></table></div>${!xs.length?empty('پروژه‌ای در محدوده یا جست‌وجوی شما نیست.'):''}</section>`}
function sourceReferencePage(){return heading('منابع و ضوابط بازرسی','مرجع، روش محاسبه و شکاف‌های ورود داده',btn('محاسبه آزمایشی گروه نظارت','source-classify'))+`<div class="notice">${SOURCE_NOTICE}</div><section class="card" style="margin-top:20px"><h2>چهار منبع ارسالی</h2><ol><li>پروژه‌های شرکت‌های تابعه — خرداد ۱۴۰۵</li><li>چک‌لیست فعالیت‌ها — ${fa(SOURCE_ITEMS.length)} رکورد کددار؛ شامل ریزبند، عبارت ناقص و سرفصل</li><li>دستورالعمل بازرسی مشاور — تجربه، طبقه‌بندی و میزان نظارت</li><li>فرم گزارش‌نویسی بازرسان — قالب عملیاتی و طبقه‌بندی نتایج</li></ol><p>متن ریزبندهای ارائه‌شده وارد شده است. فصل ۴-۳ و ریزبندهای سقف کاذب، بخش‌هایی از برق، مکانیک و آسانسور در خود متن ارائه نشده‌اند. شماره‌های ۵-۶-۴-۱ تا ۸ زیر سرفصل ۵-۶-۳ گزارش شده‌اند؛ خودکار اصلاح نشده‌اند. انتهای قراردادها بریده است.</p><p>گزارش عملیاتی نمونه پیاده شده است. گزارش‌های اختصاصی مدیریتی، تجمیعی و نهایی هنوز قالب کامل مستقل ندارند. ارائه رسمی همچنان به برنامه اجرایی تأییدشده، صلاحیت و شواهد واقعی نیاز دارد و در این نسخه نمایشی فعال نیست.</p></section><section class="card"><h2>امتیازها مستقل‌اند</h2><p>مستندات: ۱ نبود / انجام‌نشده یا غیرقابل بررسی؛ ۲ بخشی موجود؛ ۳ موجود؛ ۴ روشن؛ ۵ کامل و صحیح.</p><p>سطح ارزیابی: ۱، ۰٫۷۵، ۰٫۵، ۰٫۲۵، ۰. هیچ تبدیل خودکاری بین این مقیاس و امتیاز مستندات تعریف نشده است.</p><p>شاخص‌ها: کارکرد، تعمیرپذیری، هزینه، کیفیت، دوام، فراوانی، انطباق. وزن یا فرمول ترکیبی از منبع در دست نیست.</p><p>${Object.entries(SOURCE_CODES).map(([k,v])=>esc(k)+' — '+v).join(' · ')}</p><p>بازدیدنشده و نامرتبط نیازمند دلیل‌اند و امتیاز شکست خودکار نمی‌گیرند.</p></section><section class="card"><h2>پوشش و دفعات بازدید</h2><div class="tablewrap"><table><thead><tr><th>گروه</th><th>سازه</th><th>سفت‌کاری</th><th>نازک‌کاری</th><th>تأسیسات</th><th>ایمنی در ماه</th></tr></thead><tbody>${Object.entries(SOURCE_COVERAGE).map(([g,c])=>`<tr><td>${fa(g)}</td>${Object.values(c).map(([percent,visits])=>`<td>${fa(percent)}٪ / ${fa(visits)} بازدید</td>`).join('')}<td>۱۰۰٪ / ${fa(g==='4'?2:1)} بازدید</td></tr>`).join('')}</tbody></table></div><p>اسناد کیفیت: پوشش ۱۰۰٪؛ گروه ۱ درجه یک و دیگر گروه‌ها درجه یک و دو. دفعات در هر مرحله: گروه‌های ۱ و ۲ یک بار، گروه‌های ۳ و ۴ دو بار. تحویل: بررسی جامع ۱۰۰٪.</p><p>این درصدها جایگزین برنامه مصوب نمونه‌برداری و نقاط اجباری نمی‌شوند؛ فهرست فعالیت‌ها از پیوست‌ها وارد شده؛ مکان، تعداد واقعی و حجم نمونه برای هر مأموریت باید ثبت و تأیید شود.</p></section><section class="card"><h2>صلاحیت و واکنش فوری</h2><p>حداقل سابقه: کارشناسی ۱۵ سال، ارشد ۱۰ سال، دکتری ۵ سال؛ پروانه پایه یک یا ارشد. بررسی مدارک، بیمه، محرمانگی، تأیید معاونت و متخصص آسانسور، حریق و جوش حساس مستقل است و این صفحه تأیید صلاحیت نیست.</p><p>خطر قریب‌الوقوع، نقص بحرانی سازه، درجه یک یا تکرار درجه دو در دو بازدید متوالی: اطلاع فوری. توقف کتبی فقط با تصمیم معاونت، با علت، دامنه، مستند و مهلت؛ رفع توقف پس از اصلاح و بازدید. راستی‌آزمایی میدانی درجه یک ظرف ۲۴ ساعت.</p></section>${sourceCatalogueHtml()}${sourceMandatoryReferenceHtml()}`}
function classificationModal(){modal('محاسبه آزمایشی گروه نظارت',`<div class="notice">پارامترهای زیر را ارزیاب وارد می‌کند؛ از درصد پیشرفت استنتاج نمی‌شوند. میانگین ساده فرض سامانه است، نه فرمول وزنی مصوب. نتیجه به پروژه یا گزارش ذخیره نمی‌شود.</div><div class="formgrid">${field('تعداد بلوک','blocks','','number')}${field('تعداد طبقه','floors','','number')}${field('مساحت مورد ارزیابی','area','','number')}${select('کیفیت مورد انتظار','quality',[['1','میان‌درآمدی متوسط'],['3','خوب'],['5','برتر']])}${select('نظام مدیریت کیفیت','qms',[['1','فاقد نظام'],['3','پایه و ناقص'],['5','مستند، اجرا و بهبود']])}${select('تجربه تیم','experience',[['1','ضعیف'],['3','متوسط'],['5','خوب']])}${select('کیفیت گذشته','pastQuality',[['1','ضعیف'],['3','متوسط'],['5','خوب']])}</div>`,p=>{const c=sourceClassification(p);setTimeout(()=>modal('نتیجه آزمایشی طبقه‌بندی',`<h3>گروه نظارت ${fa(c.group)}</h3><p>پیچیدگی ${fa(c.complexity)} · بلوغ ${fa(c.maturity)}</p><p>${esc(c.method)}</p><p>سطح پایین کمتر از ۲٫۵؛ متوسط از ۲٫۵ تا ۴؛ بالا بیش از ۴.</p><p>این محاسبه، تأیید مدیر یا معاونت نیست.</p>`,()=>{},'بستن'),0)},'محاسبه بدون ثبت')}
function sourceReportPage(r){const stats=sourceQuality(r.rows),editable=engine.user.role==='inspector'&&r.inspector===engine.user.id&&r.status==='Draft'&&engine.db.cases.find(c=>c.id===r.caseId)?.status!=='Closed';return heading('گزارش عملیاتی بازرسی '+esc(r.discipline),esc(companyName(r.subsidiary))+' / '+esc(r.project),btn('فهرست گزارش‌ها','report-list','','light')+btn('چاپ گزارش','print','','light')+(editable?btn(r.demo?'ویرایش / ارسال نمونه':'تکمیل / ارسال برای بررسی','edit-report',`data-id="${esc(r.id)}"`):''))+`<article class="card inspection-report source-report"><div class="source-report-head"><div><small>گروه سرمایه‌گذاری مسکن · گزارش عملیاتی</small><h2>بازرسی تخصصی ${esc(r.discipline)}</h2><p>${esc(r.project)} · ${esc(companyName(r.subsidiary))}</p></div><div><b dir="ltr">R-O</b><p>نسخه ${fa(r.schemaVersion)}</p>${statusBadge(r.status)}</div></div><div class="notice report-origin">${r.demo?'سناریوی ارائه — بازدید، یافته، شواهد، امتیاز و طبقه‌بندی ساختگی‌اند.':'ثبت کاربر؛ ارسال برای بررسی به معنی تأیید صحت، تصویب رسمی یا تطبیق با PDF خام نیست.'}<br>${esc(r.sourceNotice)}</div>${reportWorkflowPanel(r)}${mandatoryReferralHtml(r.mandatoryReferral?.points)}<dl class="keygrid" style="margin:20px 0">${kv('بازرس منصوب',r.inspectorProfile.name)}${kv('شناسه پروژه',r.sourceProjectId||r.projectRecordId)}${kv('شناسه مأموریت',r.programId)}${kv('تاریخ مأموریت'+(r.demo?' فرضی':''),jalali(r.visitAt))}${kv('محل بازدید',r.location)}${kv('نوع و وضعیت پروژه',r.sourceProjectSnapshot.projectType+' / '+(r.sourceProjectSnapshot.executionStatus||'نامشخص'))}</dl><div class="source-stat-grid"><div><small>پیشرفت اعلامی — ${txt(r.progress.period)}</small><strong>${sourcePercent(r.progress.actualProgress)}</strong></div><div><small>پیشرفت برنامه‌ای / تأییدشده</small><strong>ثبت نشده</strong></div><div><small>انحراف برنامه</small><strong>قابل محاسبه نیست</strong></div><div><small>امتیاز توصیفی${r.demo?' نمونه':''} از ۵</small><strong>${stats.averageScore==null?'—':fa(Math.round(stats.averageScore*100)/100)}</strong></div></div><p class="note">${esc(r.progressBasis)}<br>انتخاب بندها فقط از متن چک‌لیست؛ ${r.scopeConfirmed||r.phaseConfirmed?'دامنه بازرس ثبت شده':'دامنه هنوز تأیید نشده'}. گروه نظارت ${r.classification?fa(r.classification.group)+' — با ورودی‌های فرضی':'تعیین نشده'}.</p><details><summary>مشخصات فیزیکی، دامنه و ارزیابی‌های مستقل</summary>${Object.entries(RO_FIELDS).map(([g,fields])=>`<h3>${RO_GROUPS[g]}</h3><dl class="keygrid">${Object.entries(fields).map(([k,title])=>kv(title,r.sections[g][k])).join('')}</dl>`).join('')}<dl class="keygrid">${kv('مساحت ساخته؛ ترتیب متن حفظ شده',r.sourceProjectSnapshot.reportedBuiltArea==null?'وارد نشده':fa(r.sourceProjectSnapshot.reportedBuiltArea))}${kv('مساحت زمین',r.sourceProjectSnapshot.landArea==null?'وارد نشده':fa(r.sourceProjectSnapshot.landArea))}${kv('شروع واقعی اعلامی',r.sourceProjectSnapshot.actualStart?fa(r.sourceProjectSnapshot.actualStart):'وارد نشده')}${kv('پایان برنامه‌ای اعلامی',r.sourceProjectSnapshot.plannedFinish?fa(r.sourceProjectSnapshot.plannedFinish):'وارد نشده')}</dl></details><h3 style="margin-top:24px">ارزیابی ${r.schemaVersion>=3?'بندهای':'سرفصل‌های'} ${esc(r.discipline)}</h3><p>${fa(stats.visited)} ردیف بررسی‌شده، ${fa(stats.unvisited)} بازدیدنشده، ${fa(stats.notApplicable)} نامرتبط؛ ${fa(stats.defects)} عدم‌انطباق${r.demo?' نمونه':' ثبت‌شده'}.</p><div class="report-rows">${r.rows.map(x=>`<section class="report-check"><div class="between"><h3>${txt(x.sourceCode)} · ${esc(x.title)}</h3>${badge(SOURCE_CODES[x.code],['NC-M','NC-MJ','MF'].includes(x.code)?'orange':x.code==='C'?'green':'gray')}</div><p>${x.mandatoryPointId?'نقطه اجباری مشاور — '+txt(x.assignedLocation):'بند انتخابی چک‌لیست'}</p><small>${esc(sourceDetailName(x.sourceDetail))} · شناسه ${txt(x.id)}${x.numberingIssue?' · شماره غیرمعمول منبع حفظ شده است':''}</small><dl class="keygrid">${kv('فعالیت / مرجع بند',x.activityGroup?x.activityGroup+' — '+x.requirement:x.requirement)}${kv('امتیاز مستندات / سطح ارزیابی',x.documen اقعی ندارد. نوع گزارش‌های مدیریتی، تجمیعی و نهایی با این فرم یکسان نیست.</div>${r.criticalVerificationDueAt?`<p class="notice">هشدار بحرانی${r.demo?' نمونه':''}؛ موعد بررسی میدانی ${stamp(r.criticalVerificationDueAt)}. توقف خودکار صادر نشده است.</p>`:''}<div class="row wrap no-print" style="margin-top:20px">${btn('خروجی همین گزارش','export-report',`data-id="${esc(r.id)}"`,'soft')}<small>${r.submittedAt?'ارسال برای بررسی: '+stamp(r.submittedAt):'پیش‌نویس'} · ${fa(r.history.length)} رویداد</small></div>${r.history.length?`<details class="no-print"><summary>تاریخچه و نسخه‌های پیشین</summary>${r.history.map(h=>`<p>${txt(h.event)} · ${esc(person(h.by))} · ${stamp(h.at)}</p><pre class="report-history">${txt(JSON.stringify(h.before,null,2))}</pre>`).join('')}</details>`:''}</article>`}
