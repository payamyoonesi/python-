const INSPECTOR_ROW_FIELDS={selectedObservation:'مشاهده استاندارد انتخابی',selectedSiteCause:'علت کارگاهی انتخابی',inspectorAnalysis:'تحلیل بازرس؛ ارتباط شواهد، انحراف و پیامد',causeEvidence:'شواهد علت پیشنهادی یا بررسی لازم برای احراز آن',measured:'اندازه‌گیری یا نتیجه کنترل کیفی بند',revisitPlan:'برنامه بازدید مجدد بند بازدیدنشده',location:'محل دقیق',observation:'شرح مشاهده',evidence:'شاهد',reason:'دلیل بازدیدنشده / نامرتبط',frequency:'فراوانی',effect:'گستره اثر',priority:'اولویت',workStatus:'وضعیت کار',projectImpact:'اثر بر پروژه',safetyImpact:'اثر ایمنی',directCause:'علت مستقیم',contributingCause:'علت مشارکت‌کننده',rootCause:'علت ریشه‌ای پیشنهادی؛ نیازمند تأیید شرکت',failedProcess:'فرایند یا روش ناموفق',responsibility:'مسئولیت فرایند',recommendation:'اقدام پیشنهادی',assignee:'مسئول اقدام',acceptance:'معیار پذیرش',resources:'منابع یا تصمیم لازم',furtherAnalysis:'نیاز به تحلیل بیشتر'};
function sourceReportPayload(r,p){const rowFields=INSPECTOR_ROW_FIELDS;return {...p,...(r.schemaVersion>=3?{mandatoryPoints:r.mandatoryPoints.map((x,i)=>({planId:x.planId,total:p['pointTotal'+i],visited:p['pointVisited'+i],unit:p['pointUnit'+i],locations:p['pointLocations'+i],reason:p['pointReason'+i],revisitPlan:p['pointRevisit'+i],evidence:p['pointEvidence'+i],assignee:p['pointAssignee'+i]}))}:{}),sections:Object.fromEntries(Object.entries(RO_FIELDS).map(([g,fs])=>[g,Object.fromEntries(Object.keys(fs).map(k=>[k,p[g+'__'+k]]))])),rows:r.rows.map((x,i)=>({id:x.id,documents:p['rowDocuments'+i]||[],reviewed:p['reviewed'+i]===true,code:p['code'+i],documentScore:p['score'+i],assessmentLevel:p['level'+i],actionCode:p['actionCode'+i],...Object.fromEntries(Object.keys(rowFields).map(k=>[k,p[k+i]]))}))}}
function editSourceReportModal(r){const rowFields=INSPECTOR_ROW_FIELDS;modal('تکمیل چک‌لیست و گزارش تحلیلی '+esc(r.discipline),`<div class="notice">هویت مأموریت و کد بند قفل‌اند. امتیاز مستقل از طبقه‌بندی نتیجه است. برای بازدیدنشده و نامرتبط هر دو امتیاز را خالی و دلیل ثبت کنید. نام شرکت، پروژه، بازرس و رشته قفل‌اند. برای هر بند یک نتیجه را تیک بزنید؛ تأیید بند به معنی بازدید فیزیکی برای موارد نامرتبط یا بازدیدنشده نیست. ذخیره پیش‌نویس با ارسال برای بررسی تفاوت دارد.</div><p class="notice">علت ریشه‌ای در این فرم، پیشنهاد بازرس است؛ اگر احراز نشده، نامعلوم‌بودن و بررسی لازم را بنویسید. تأیید شرکت، تحلیل پنج چرا و نظر مشاور جدا ثبت می‌شوند. برای ذخیره تدریجی، گزینه ارسال را تیک نزنید؛ محل و جمع‌بندی در پیش‌نویس می‌توانند خالی بمانند.</p><dl class="keygrid">${kv('شرکت',companyName(r.subsidiary))}${kv('پروژه',r.project)}${kv('بازرس',r.inspectorProfile.name)}${kv('رشته',r.discipline)}${kv('مأموریت',r.programId)}</dl><div class="notice"><b>شرح ارجاع مشاور</b><p>${txt(engine.db.inspectionPrograms.find(p=>p.id===r.programId)?.purpose||'شرح برنامه بازدید را بررسی کنید.')}</p>${!r.phaseConfirmed?'<p>بند دیگر را از کشویی همین فرم فراخوانی کنید. برای کنارگذاشتن بندهای انتخابی خود، پس از ذخیره پیش‌نویس، از «انتخاب و تأیید بندهای مرتبط» استفاده کنید. نقاط اجباری مشاور قابل حذف نیستند.</p>':''}</div>${field('محل بازدید','location',r.location,'text',false)}${Object.entries(RO_FIELDS).map(([g,fields])=>`<details><summary>${RO_GROUPS[g]}</summary><div class="formgrid">${Object.entries(fields).map(([k,label])=>field(label,g+'__'+k,r.sections[g][k],'text',false)).join('')}</div></details>`).join('')}${mandatoryReferralHtml(r.mandatoryReferral?.points)}<section class="notice"><h3>فراخوانی بند دیگر از چک‌لیست</h3>${checklistDropdown(r.discipline,"additionalChecklistCode")}${btn("فراخوانی بند انتخاب‌شده","add-checklist-item",`data-id="${esc(r.id)}"`,"soft")}<small>متن و عکس‌های واردشده ابتدا به‌صورت پیش‌نویس ذخیره می‌شوند؛ بند جدید عین متن منبع اضافه می‌شود.</small></section>${!r.rows.length?"<p>فرم بدون بند حدسی است؛ بند موردنظر را از پنجره کشویی بالا فراخوانی کنید.</p>":""}${r.rows.map((x,i)=>`<fieldset class="report-check"><legend>${txt(x.sourceCode)} · ${esc(x.title)}</legend><p class="notice">${x.mandatoryPointId?"نقطه اجباری ارجاع مشاور — محل: "+txt(x.assignedLocation):"بند فراخوانی‌شده توسط بازرس از چک‌لیست"}</p><p class="note">${esc(sourceDetailName(x.sourceDetail))} · ${txt(x.requirement)}</p><div class="formgrid">${reportResultInputs(x,i)}${select('امتیاز مستندات','score'+i,[['','بدون امتیاز'],...[1,2,3,4,5].map(n=>[n,fa(n)])],x.documentScore??'',false)}${select('سطح مستقل ارزیابی','level'+i,[['','بدون امتیاز'],...[0,0.25,0.5,0.75,1].map(n=>[n,fa(n)])],x.assessmentLevel??'',false)}${select('نوع اقدام','actionCode'+i,[['','انتخاب نوع اقدام'],['ACT-I','فوری'],['ACT-C','اصلاحی'],['ACT-P','پیشگیرانه']],x.actionCode,false)}</div><div class="card" style="background:#fcfaff;border:1px solid #ebdcfc;padding:12px;margin:12px 0">
  <h4 style="margin:0 0 8px 0;color:#5b21b6">۱. انتخاب نوع مشاهده/عیب میدانی از لیست کشویی دیسیپلین ${esc(r.discipline)}</h4>
  ${select('مشاهده / نقص استاندارد کشویی','selectedObservation'+i,[['','(انتخاب عیب استاندارد از کشو)'],...(DISCIPLINE_OBSERVATIONS[r.discipline]||[])],x.selectedObservation||'',false)}
  ${area('علت و شواهد تفصیلی انتخاب این مشاهده در پروژه','observation',x.observation,false)}
</div>
<div class="card" style="background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;margin:12px 0">
  <h4 style="margin:0 0 8px 0;color:#166534">۲. علت اولیه در حد زمان و پروژه (سطح بازرس کارگاه)</h4>
  ${select('علت کارگاهی اولیه از کشو','selectedSiteCause'+i,[['','(انتخاب علت کارگاهی از کشو)'],...SITE_ROOT_CAUSES],x.selectedSiteCause||'',false)}
  ${area('شرح و شواهد علت کارگاهی انتخاب‌شده','causeEvidence',x.causeEvidence,false)}
</div>
${['location','measured','evidence','reason','revisitPlan','recommendation','assignee','acceptance'].map(k=>(['evidence','recommendation','acceptance'].includes(k)?area(rowFields[k],k+i,x[k],false):field(rowFields[k],k+i,x[k],'text',false))).join('')}<label>عکس یا مستند همین بند — ${txt(x.sourceCode)}<input name="rowDocuments${i}" type="file" accept="image/png,image/jpeg,application/pdf" multiple></label>${checklistPhotosHtml(r,x)}<section class="inspector-analysis"><h3>تحلیل بازرس و علل پیشنهادی این بند</h3>${['inspectorAnalysis','directCause','contributingCause','rootCause','causeEvidence','failedProcess','responsibility'].map(k=>area(rowFields[k],k+i,x[k],false)).join('')}</section><details><summary>آثار و منابع تکمیلی</summary>${Object.entries(rowFields).filter(([k])=>!['location','observation','measured','evidence','reason','revisitPlan','recommendation','assignee','acceptance','inspectorAnalysis','directCause','contributingCause','rootCause','causeEvidence','failedProcess','responsibility'].includes(k)).map(([k,label])=>field(label,k+i,x[k],'text',false)).join('')}</details></fieldset>`).join('')}${sourcePlanFields(r)}${area('جمع‌بندی تحلیلی بازرس','summary',r.summary,false)}${select('نوع پیوست جدید','documentCategory',Object.entries(SOURCE_ATTACHMENT_TYPES))}${filesField()}${check('بندهای انتخاب‌شده و نقاط ارجاع مشاور را در این نسخه بررسی کرده‌ام','scopeConfirmed',r.scopeConfirmed||r.phaseConfirmed)}${check('مسئولیت اطلاعات، دامنه و مستندات این نسخه را می‌پذیرم','attestation')}${check(r.demo?'ارسال نمونه به مشاور و قفل نسخه؛ نه بازدید واقعی':'ارسال برای بررسی مشاور و قفل نسخه؛ نه تأیید رسمی','submit')}`,p=>engine.saveSourceReport(r.id,sourceReportPayload(r,p)))}

function reportsPage(){const availableReports=engine.reports(),reports=availableReports.filter(r=>Object.entries(reportFilters).every(([k,v])=>!v||r[k]===v)),r=availableReports.find(r=>r.id===selectedReport);if(r?.schemaVersion>=2)return sourceReportPage(r);const note='<div class="notice report-origin">گزارش‌های قدیمی این بخش عمومی‌اند؛ تطبیق با سه PDF ارسالی انجام نشده. گزارش‌های جدید با نشان نسخه عملیاتی، از اطلاعات متن کاربر استفاده می‌کنند. فعالیت‌ها از درصد کل پروژه پیشنهاد شده‌اند و جایگزین برنامه تفصیلی رشته نیستند. هیچ بازدید یا مدرک واقعی ادعا نمی‌شود.</div>';if(!r)return heading('گزارش‌های مستقل رشته‌ای','هر گزارش متعلق به یک مأموریت، پروژه و بازرس مشخص است.',engine.user.role==='consultant'?btn('نمونه از پروژه‌های خرداد ۱۴۰۵','source-demo','','')+btn('سناریوی عمومی قبلی','demo-reports','','light'):'')+inspectorWorkPanel()+note+reportFilterHtml(availableReports)+`<div class="listcards" style="margin-top:20px">${reports.map(r=>`<article class="card"><div class="between">${badge(r.discipline)}${statusBadge(r.status)}</div><h3>${esc(r.project)}</h3><small>${esc(companyName(r.subsidiary))} · ${esc(r.inspectorProfile.name)}</small><p>پیشرفت ثبت‌شده: ${r.progress?.actualProgress!=null?fa(r.progress.actualProgress)+'٪':'ثبت نشده'}</p><p class="muted" style="font-size:11px">${fa(r.rows.length)} فعالیت تخصصی · ${r.schemaVersion>=3?'نسخه ۳ — ریزبندهای منبع':r.schemaVersion===2?'نسخه ۲ — سرفصل منبع':r.demoScenarioOwner?'سناریوی ارائه جدید':'مأموریت موجود'}</p>${badge(r.demo?'گزارش نمایشی':'ثبت کاربر؛ نیازمند بررسی',r.demo?'orange':'gray')}${btn('مشاهده گزارش و چک‌لیست','open-report',`data-id="${esc(r.id)}"`,'soft')}</article>`).join('')}</div>${reports.length?'':`<div class="card">${empty('برای مأموریت صادرشده و منطبق با رشته شما، گزارش در این بخش ساخته می‌شود.')}</div>`}`;const editable=engine.user.role==='inspector'&&r.inspector===engine.user.id&&r.status==='Draft'&&engine.db.cases.find(c=>c.id===r.caseId)?.status!=='Closed';return heading('گزارش بازرسی '+esc(r.discipline),esc(r.project),btn('فهرست گزارش‌ها','report-list','','light')+btn(icon('print')+' چاپ / ذخیره پی‌دی‌اف','print','','light')+(editable?btn('ویرایش / ارائه گزارش','edit-report',`data-id="${esc(r.id)}"`,''):''))+`<article class="card inspection-report">${engine.user.role==='inspector'?`<div class="notice">این گزارش قدیمی${r.status==='Submitted'?' ارسال‌شده و قفل است؛ متن آن تغییر نمی‌کند':' از قالب عمومی است'}. برای نوشتن در قالب چک‌لیست، فرم مستقل همان ارجاع را باز کنید.${inspectorEntryHtml(engine.db.inspectionPrograms.find(p=>p.id===r.programId))}</div>`:''}${note}<div class="between" style="margin:20px 0"><h2>گزارش مستقل مأموریت ${esc(r.discipline)}</h2>${statusBadge(r.status)}</div><dl class="keygrid">${kv('پروژه',r.project)}${kv('شرکت',companyName(r.subsidiary))}${kv('بازرس',r.inspectorProfile.name)}${kv('رشته / رده',r.discipline+' / '+(r.inspectorProfile.grade||'ثبت نشده'))}${kv('شماره پروانه نمونه',r.inspectorProfile.license)}${kv('تاریخ مأموریت',jalali(r.visitAt))}${kv('شناسه مأموریت',r.programId)}${kv('محل بازدید',r.location)}</dl><div class="note">پیشرفت برنامه‌ای: ${r.progress?fa(r.progress.plannedProgress)+'٪':'ثبت نشده'} · پیشرفت واقعیِ داده موجود: ${r.progress?.actualProgress!=null?fa(r.progress.actualProgress)+'٪':'ثبت نشده'} · انحراف: ${r.progress?fa(r.progress.deviation)+'٪':'—'}<br>دوره: ${txt(r.progress?.period||'—')}<br>${txt(r.progressBasis)}</div><h3 style="margin:22px 0 12px">فعالیت‌ها و نتایج نمونه</h3><div class="report-rows">${r.rows.map((x,i)=>`<section class="report-check"><div class="between"><h3>${fa(i+1)}. ${esc(x.title)}</h3>${badge(REPORT_RESULT_FA[x.result],x.result==='Attention'?'orange':x.result==='Conform'?'green':'gray')}</div><dl class="keygrid">${kv('مرجع پیشنهادی',x.requirement)}${kv('مشاهده نمایشی',x.observation)}${kv('شاهد',x.evidence)}${kv('پیشنهاد / اقدام',x.recommendation)}${kv('مسئول پیگیری',x.assignee)}</dl></section>`).join('')||empty('ابتدا مدیر کنترل پروژه داده همین پروژه و شرکت را ثبت کند؛ سپس بازرس نمونه گزارش را تکمیل کند.')}</div><div class="divider"></div><h3>جمع‌بندی بازرس — نسخه نمایشی</h3><p>${txt(r.summary||'هنوز ثبت نشده')}</p><div style="margin:15px 0">${attachments(r.documents)}</div><small>${r.submittedAt?'ارائه به کارتابل: '+stamp(r.submittedAt)+' · '+esc(person(r.submittedBy)):'پیش‌نویس؛ ارائه نشده است.'}</small><div class="no-print row wrap" style="margin-top:20px">${editable?btn('پر کردن با نمونه عمومی نمایشی','fill-report',`data-id="${esc(r.id)}"`,'light small'):''}${btn('خروجی همین گزارش','export-report',`data-id="${esc(r.id)}"`,'light small')}</div>${r.history.length?`<details class="no-print" style="margin-top:20px"><summary>تاریخچه گزارش (${fa(r.history.length)} رویداد)</summary><div class="timeline">${r.history.map(h=>`<div class="timeline-item">${esc(h.event)} · ${esc(person(h.by))}<br><small>${stamp(h.at)}</small><details><summary>نسخه پیشین</summary><pre class="report-history">${txt(JSON.stringify(auditDisplay(h.before),null,2))}</pre></details></div>`).join('')}</div></details>`:''}</article>`}
function editReportModal(id){const r=engine.reports().find(r=>r.id===id);if(!r)throw Error('گزارش در محدوده شما نیست.');if(r.schemaVersion>=2)return editSourceReportModal(r);modal('ویرایش گزارش نمایشی '+esc(r.discipline),`<div class="notice">پروژه و رشته قابل تغییر نیستند. ارائه گزارش، تأیید مشاور یا تصمیم معاونت محسوب نمی‌شود و چرخهٔ ۲۴ گامی را خودکار جلو نمی‌برد.</div>${field('محل بازدید','location',r.location)}${r.rows.map((x,i)=>`<fieldset class="report-check"><legend>${fa(i+1)} · ${esc(x.title)}</legend>${select('نتیجه نمایشی','result'+i,Object.entries(REPORT_RESULT_FA),x.result)}${area('مشاهده','observation'+i,x.observation)}${area('شاهد','evidence'+i,x.evidence)}${area('پیشنهاد یا اقدام','recommendation'+i,x.recommendation)}${field('مسئول پیگیری','assignee'+i,x.assignee)}</fieldset>`).join('')}${area('جمع‌بندی','summary',r.summary)}${filesField()}${check('ارائه گزارش و قفل ویرایش این نسخه','submit')}`,p=>engine.saveReport(id,{...p,rows:r.rows.map((x,i)=>({id:x.id,result:p['result'+i],observation:p['observation'+i],evidence:p['evidence'+i],recommendation:p['recommendation'+i],assignee:p['assignee'+i]}))}))}

function pmoChartsSvg(xs){
  const delayed = xs.filter(x=>x.deviation < 0).length;
  const ontrack = xs.filter(x=>x.deviation >= 0).length;
  const avgDev = xs.length ? (xs.reduce((acc,x)=>acc+x.deviation,0)/xs.length).toFixed(1) : 0;
  
  // Bar chart of deviations for projects
  const topXs = xs.slice(0, 10);
  const minDev = Math.min(-1, ...topXs.map(x=>x.deviation));
  const maxDev = Math.max(1, ...topXs.map(x=>x.deviation));
  const range = Math.max(Math.abs(minDev), Math.abs(maxDev), 10);
  
  const bars = topXs.map((x, i)=>{
    const barW = Math.abs(x.deviation) / range * 110;
    const isNeg = x.deviation < 0;
    const xPos = isNeg ? 140 - barW : 140;
    const color = isNeg ? '#e11d48' : '#10b981';
    return `<g>
      <text x="135" y="${22 + i*22}" font-size="9" text-anchor="end" fill="#475569" font-family="Vazirmatn">${esc(x.project)} (${companyName(x.subsidiary).replace(/گروه سرمایه‌گذاری مسکن\s*/,'')})</text>
      <line x1="140" y1="5" x2="140" y2="235" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="${xPos}" y="${12 + i*22}" width="${Math.max(3, barW)}" height="13" rx="3" fill="${color}"/>
      <text x="${isNeg ? xPos - 5 : xPos + barW + 5}" y="${22 + i*22}" font-size="9" text-anchor="${isNeg ? 'end' : 'start'}" fill="${color}" font-weight="700" font-family="Vazirmatn">${fa(x.deviation)}٪</text>
    </g>`;
  }).join('');

  return `<section class="charts" style="margin-bottom:20px;grid-template-columns:1.4fr 1fr">
    <article class="card chart" style="min-height:260px">
      <div class="between">
        <h3>انحراف پیشرفت پروژه‌ها (واقعی منهای برنامه)</h3>
        <small class="muted">قرمز = عقب‌ماندگی · سبز = پیشرفت مطابق برنامه</small>
      </div>
      <svg viewBox="0 0 280 245" style="width:100%;height:230px">${bars}</svg>
    </article>
    <article class="card chart" style="min-height:260px">
      <div class="between">
        <h3>وضعیت انطباق با زمان‌بندی کل</h3>
        <small class="muted">پایش انحرافات</small>
      </div>
      <svg viewBox="0 0 200 180" style="width:100%;height:180px">
        <circle cx="100" cy="85" r="45" fill="none" stroke="#fee2e2" stroke-width="18"/>
        <circle cx="100" cy="85" r="45" fill="none" stroke="#10b981" stroke-width="18" stroke-dasharray="${(ontrack/(xs.length||1))*283} 283" transform="rotate(-90 100 85)"/>
        <text x="100" y="85" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Vazirmatn">${fa(xs.length)}</text>
        <text x="100" y="103" text-anchor="middle" font-size="9" fill="#64748b" font-family="Vazirmatn">پروژه تحت پایش</text>
      </svg>
      <div class="legend" style="justify-content:center;gap:15px;margin-top:10px">
        <span><i class="dot" style="background:#10b981"></i>${fa(ontrack)} مطابق برنامه</span>
        <span><i class="dot" style="background:#e11d48"></i>${fa(delayed)} دارای تأخیر</span>
      </div>
      <p class="chart-bottom" style="text-align:center;margin-top:8px">میانگین کل انحراف سبد: <b>${fa(avgDev)}٪</b></p>
    </article>
  </section>`;
}

function workflowPage(){return heading('نقش‌ها و گردش‌کار','چرخه ۲۴ گامی؛ دسترسی‌های درختی مدیران و کارشناسان زیرمجموعه',engine.user.role==='admin2'?btn('ثبت شناسه نسخه','workflow-version','','light'):btn(icon('print')+' چاپ','print','','light'))+`<section class="card" style="margin-bottom:20px"><h2>ساختار راهبری و ارتباطات</h2><div class="tree" style="margin-top:22px"><div class="tree-level"><div class="tree-node external">مدیرعامل گروه سرمایه‌گذاری مسکن<small>خارج سامانه · دریافت گزارش و تصمیم خروج از چرخه</small></div></div><details class="org-disclosure"><summary class="tree-node" style="--rc:#865bbb">معاونت فناوری و مدیریت ساخت گروه<small>برای نمایش دسترسی مدیران و کارشناسان کلیک کنید</small></summary><div class="org-managers">${MANAGERS.map(m=>`<details class="org-manager"><summary class="tree-node" style="--rc:#d49a55">${ROLES[m].name}<small>${esc(person(m))}</small><small>${ROLES[m].scope}</small></summary><div class="expert-children">${engine.db.users.filter(u=>u.role==='expert'&&managerOf(u)===m).map(u=>`<div class="tree-node" style="--rc:#42a9a5">${esc(u.name)}<small>زیرمجموعه ${ROLES[m].name} · ${m==='construction'?'فقط رشته خود':'فقط کار ارجاع‌شده خود'}</small></div>`).join('')}</div></details>`).join('')}</div></details><div class="tree-level"><div class="tree-node" style="--rc:#5c8acb">شرکت مشاور<small>معرفی بازرس، تحلیل و نظر مستقل</small><div class="expert-children"><div class="tree-node">ادمین بازرسان مشاور<small>زیرمجموعه مشاور · مدیریت حساب و صلاحیت</small></div></div></div><div class="tree-node" style="--rc:#3c9f7d">بازرس<small>پذیرش مأموریت و ثبت واقعیت</small></div><div class="tree-node" style="--rc:#8d94a0">۱۲ شرکت تابعه<small>طرف اقدام، تحلیل مستقل و اعتراض</small></div></div></div><div class="divider"></div><div class="split"><div class="note">مسیر کارشناسی: مشاور ← بازرس ← واقعیت ← تحلیل مشاور<br>مسیر تصمیم: نظر مشاور + تحلیل شرکت ← معاونت ← ابلاغ</div><div class="note">مسیر یادگیری: یافته بسته ← طرح و توسعه ← درس‌آموخته ← نقش‌ها<br>مسیر پایش: ناظر ← دفتر مدیریت پروژه ← کنترل مجدد ← مشاور</div></div></section><section class="card" style="margin-bottom:20px"><h2 style="margin-bottom:20px">چرخه اصلی · ۲۴ گام</h2>${flowHtml()}<div class="notice" style="margin-top:20px">شاخه‌ها: رد مأموریت ← صدور مجدد؛ راستی‌آزمایی مشروط یا رد ← اقدام شرکت؛ اثربخشی نسبی ← اقدام، بی‌اثر ← بازتحلیل علت ریشه‌ای. در مسیر سریع، مکاتبه و اقدام موازی‌اند.</div></section><section class="card" style="margin-bottom:20px"><h2>ماشین‌های وضعیت مستقل</h2>${Object.entries(STATES).map(([k,ss])=>`<div class="statebox"><h3>${{case:'پرونده',finding:'یافته',action:'اقدام اصلاحی',communication:'مکاتبه',verification:'راستی‌آزمایی',qualification:'صلاحیت بازرس'}[k]}</h3><div class="statepath">${ss.map(s=>`<span>${statusFa(s)}</span>`).join('')}</div><small>${k==='action'?'مؤثر و بی‌اثر شاخه‌های جایگزین‌اند.':k==='verification'?'تأیید کامل، مشروط و رد سه خروجی جایگزین‌اند.':k==='qualification'?'فعال، مشروط، تعلیق و لغو وضعیت‌های صلاحیت‌اند؛ انتقال خطی نیست.':''}</small></div>`).join('')}</section><section class="card"><h2>مهلت خدمت و دامنه دسترسی</h2><div class="split"><div class="tablewrap"><table><thead><tr><th>فاز</th><th>عادی / روز</th><th>سریع / روز</th></tr></thead><tbody>${PHASES.map(p=>`<tr><td>${p.name}</td><td>${fa(p.days)}</td><td>${new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2}).format(p.days/3)}</td></tr>`).join('')}<tr><td>مجموع</td><td>۸۷</td><td>۲۹</td></tr></tbody></table></div><div class="tablewrap"><table><thead><tr><th>نقش</th><th>دامنه مجاز</th></tr></thead><tbody>${Object.values(ROLES).map(r=>`<tr><td>${r.name}</td><td style="white-space:normal">${r.scope}</td></tr>`).join('')}</tbody></table></div></div><p class="muted" style="font-size:11px;margin-top:15px">مهلت‌ها بر حسب روز تقویمی و از شروع فاز محاسبه می‌شوند؛ تقویم تعطیلات سازمانی در این نسخه تعریف نشده است.</p></section>`}
function specializedDashboard(){let r=engine.user.role;return heading('فضای کاری '+ROLES[r].name,ROLES[r].scope)+`<section class="hero"><div><h2>${esc(engine.user.name)}، خوش آمدید.</h2><p>محتوای عملیاتی پرونده‌ها برای این نقش نمایش داده نمی‌شود.</p></div><div class="hero-seal">${icon(r==='pmo'?'chart':'settings')}</div></section>${r==='pmo'?controlsPage():r==='admin1'?qualificationsPage():`<div class="stats">${stat('رویداد فنی',engine.audit().length,'audit','#8e6abc','فراداده بدون محتوای کسب‌وکار')}${stat('نسخه گردش‌کار',engine.db.workflowVersion,'branch','#6d9b9a','شناسه نسخه محلی')}</div><div class="card"><h2>پنل زیرساخت</h2><p class="muted" style="margin:12px 0">نسخه داده: ${fa(engine.db.version)} · نوبت ذخیره: ${fa(engine.db.revision)}</p><div class="row">${btn('تاریخچه فنی','nav','data-id="audit"','soft')}${btn('ثبت شناسه نسخه','workflow-version','','light')}</div></div>`}`}
function helpPage(){return heading('راهنمای نسخه محلی','دامنه پیاده‌سازی، فرض‌های اجرایی و الزامات بهره‌برداری')+`<div class="stack"><section class="card"><h2>یک فایل؛ بدون وابستگی شبکه</h2><p style="margin:12px 0">این فایل دارای فونت وزیرمتن، سبک‌ها و کد داخلی است. آن را دانلود و مستقیماً با مرورگر باز کنید. داده‌ها به همان مرورگر و مبدأ وابسته‌اند؛ فایل محلی و پیش‌نمایش وب فضای ذخیره جدا دارند.</p>${btn(icon('download')+' دریافت فایل مستقل سامانه','download-app')}</section><section class="card"><h2>محدودیت امنیت و داده</h2><ul class="activity"><li>کنترل نقش در خواندن، خروجی و عملیات اعمال می‌شود، اما امنیت واقعی ردیفی نیست؛ همه داده و حساب‌ها در مرورگر مالک فایل قرار دارند.</li><li>اعتبارنامه‌ها نمایشی و به‌صورت محلی ذخیره‌اند. برای داده واقعی باید احراز هویت سمت سرور، هش امن گذرواژه و سیاست‌های پایگاه داده جایگزین شوند.</li><li>تاریخچه در برنامه حذف نمی‌شود ولی در برابر ابزار توسعه مرورگر مقاوم نیست. نسخه عملیاتی نیازمند ثبت وقایع افزایشی سمت سرور است.</li><li>اعلان فوری داخل همین نمونه نمایش داده می‌شود؛ ارسال پیامک، ایمیل و تحویل واقعی مکاتبه انجام نمی‌شود.</li><li>خروجی داده، محدود به نقش فعلی است و نسخه پشتیبان کامل نیست. بازیابی دلخواه داده برای جلوگیری از دور زدن اعتبارسنجی ارائه نشده است.</li></ul></section><section class="card"><h2>فرض‌ها و تصمیم‌های پیاده‌سازی</h2><ul class="activity"><li>تصاویر صفحه ورود نمادین و تولیدشده‌اند؛ تصویر واقعی مدیران نام‌برده نیستند. تمام تصاویر داخل فایل ذخیره شده‌اند و اتصال شبکه نمی‌خواهند.</li><li>دسترسی‌ها زیر مجموعه معاونت و مدیر مربوط نمایش داده می‌شوند؛ پنج کارشناس رشته زیر مدیر ساخت و کارشناسان طرح و توسعه، کنترل پروژه و قراردادها زیر مدیر مربوط هستند. مدیرعامل بیرون سامانه است؛ گزارش چاپی یا خروجی معاونت به او تحویل می‌شود و تصمیم خروج در این نسخه ثبت نمی‌شود.</li><li>ادمین بازرسان مشاور فقط حساب و صلاحیت را مدیریت می‌کند؛ ثبت مأموریت بعد از تأیید مدیر ساخت خودکار است.</li><li>چرخه‌ها مستقل‌اند؛ وضعیت پرونده از کمترین گام یافته باز محاسبه می‌شود، اما بستن آن فقط با اقدام معاونت و احراز پنج شرط ممکن است.</li><li>مهلت عادی ۸۷ روز تقویمی، سریع دقیقاً یک‌سوم یعنی ۲۹ روز است. تعطیلات و ساعات کاری سازمانی تنظیم نشده‌اند.</li><li>هر پیوست تا ۵۰۰ کیلوبایت است؛ ظرفیت کلی به مرورگر بستگی دارد. شکست ذخیره‌سازی باعث بازگردانی عملیات می‌شود.</li><li>مدیریت شرکت‌ها در این نسخه شامل فعال و غیرفعال کردن ۱۲ شرکت مصوب است، نه حذف یا ایجاد خارج از این فهرست.</li><li>شناسه نسخه در پنل زیرساخت صرفاً فراداده است؛ ویرایش گرافیکی قوانین گردش‌کار ارائه نشده است.</li><li>اسناد قبلی چارت، الگوی قدیمی ۲۶ گامی هستند؛ مرجع این نسخه فقط بخش «نقش‌ها و گردش‌کار» است.</li></ul></section><section class="card"><h2>آزمایش سریع</h2><p>برای سناریوی آماده چهار رشته، با مشاور وارد «گزارش‌های رشته‌ای» شوید و «ساخت سناریوی ارائه چهاررشته‌ای» را بزنید. پروژه، درصد پیشرفت و گزارش‌ها نمایشی و غیرمنطبق با PDFهای مستقلاً بررسی‌نشده‌اند. گزارش‌های قدیمی عمومی باقی مانده‌اند؛ قالب عملیاتی نسخه ۳ از متن ریزبندهای ارائه‌شده و پیوست نقاط اجباری استفاده می‌کند. قسمت‌های ناقص خود منبع در «منابع و ضوابط» مشخص‌اند. هر مأموریت جدید گزارش پیش‌نویس مستقل دارد.</p><ol class="activity"><li>با حساب معاونت وارد شوید؛ پرونده بتن برج بهار آماده ثبت تصمیم مستقل است.</li><li>با شرکت جنوب، پرونده سازه سپیدار را فقط خواندنی بررسی کنید؛ سپس با معاونت اثربخشی را ارزیابی کنید.</li><li>با شرکت الوند، برای یافته بحرانی سرو اقدام اصلاحی و تحلیل پنج چرا ثبت کنید.</li><li>با مدیر فناوری اطلاعات، فقط پرونده بسته مجتمع بهشت را ببینید.</li><li>برای چرخه کامل، با مشاور پرونده جدید بسازید؛ بازرس نمونه سازه را پیوند دهید و نقش‌ها را در هر گام تغییر دهید.</li></ol></section></div>`}
function openCase(id,fid){selectedCase=id;selectedFinding=fid||null;detailTab='report';view='detail';render();window.scrollTo(0,0)}
function advanceModal(){let{c,f}=detailData(),n=f.nextStep,html='',title='گام '+fa(n)+' · '+STEP_NAMES[n-1];if([4,18].includes(n)){view='programs';render();toast('برنامه را از این بخش پیشنهاد یا بررسی کنید.');return}if(n===24){closeCaseModal();return}switch(n){case 1:html=select('بازرس معرفی‌شده توسط شما','applicationId',engine.applications().map(a=>[a.id,a.inspectorInfo.name+' · '+statusFa(a.status)]),f.applicationId)+`<div class="note">اگر فهرست خالی است از بخش صلاحیت، بازرس معرفی کنید.</div>`;break;case 2:html=`<div class="note">این گام فقط پس از تأیید مدیر ساخت و معاونت و ساخت حساب در بخش صلاحیت تکمیل می‌شود. تأیید این پنجره جایگزین آن مراحل نیست.</div>`;break;case 3:html=`<div class="note">بازرس تأییدشده معرفی‌نامه به رشته ${esc(f.discipline)} و پروژه ${esc(c.project)} منتسب می‌شود؛ رشته باید منطبق باشد.</div>`;break;case 5:html=select('پاسخ به مأموریت','verdict',[['accept','پذیرش مأموریت'],['reject','رد و بازگشت به صدور']])+area('شرح پذیرش یا علت رد','note');break;case 6:case 19:html=area('گزارش بازدید میدانی','note');break;case 7:html=`${reportReferenceHtml(f)}${f.reportInputSource?check('واقعیت‌های این گام با گزارش متصل تطابق دارند','reportMatchesField'):''}<div class="formgrid">${area('واقعیت میدانی','observation',f.observation)}${area('معیار پذیرش','acceptanceCriteria',f.acceptanceCriteria)}${field('محل','location',f.location)}${field('اندازه‌گیری','measured',f.measured)}${[['impact','اثر'],['area','حوزه'],['productActivity','محصول / فعالیت'],['frequency','فراوانی'],['impactScope','دامنه اثر'],['workStatus','وضعیت کار'],['actualConsequence','پیامد واقعی'],['potentialConsequence','پیامد بالقوه'],['safetyConsequence','پیامد ایمنی'],['resources','منابع'],['actionPriority','اولویت اقدام'],['actionType','نوع اقدام'],['referenceType','نوع مرجع']].map(([k,l])=>field(l,k,f[k]||'','text',false)).join('')}</div>${filesField()}`;break;case 8:html=area('عدم‌انطباق','nonconformity',f.nonconformity)+area('الزام نقض‌شده','requirementViolated',f.requirementViolated)+select('شدت','severity',[['minor','جزئی'],['major','مهم'],['critical','بحرانی — فعال‌سازی مسیر سریع']],f.severity);break;case 9:html=`<div class="formgrid">${select('احتمال','probability',[1,2,3,4,5],f.risk?.probability||3)}${select('اثر','impact',[1,2,3,4,5],f.risk?.impact||3)}</div><div class="note">امتیاز ریسک = احتمال × اثر. امتیاز ۲۰ و بیشتر بحرانی است و به معاونت اعلان می‌شود.</div>`;break;case 10:html=area('علت مستقیم','directCause',f.directCause)+`<div class="note">علت مستقیم رخداد را ثبت کنید؛ علت ریشه‌ای در گام مستقل بعد است.</div>`;break;case 11:html=area('علت ریشه‌ای','rootCause',f.rootCause)+`<div class="note">تحلیل پنج چرا و تأیید شرکت: ${f.companyAnalysis?.confirmed?'انجام شده':'هنوز انجام نشده؛ شرکت باید از تب تحلیل شرکت اقدام کند'}</div>`;break;case 12:html=area('نظر مستقل کارشناسی','summary',f.expertOpinion?.summary)+area('اقدام پیشنهادی','recommendedAction',f.expertOpinion?.recommendedAction)+check('کنترل شکلی انجام شده','formal')+check('کنترل فنی انجام شده','technical')+check('کنترل مدیریتی انجام شده','managerial');break;case 13:html=area('تصمیم نهایی معاونت','decision')+area('مبنای تصمیم','basis')+dateField('مهلت اقدام','deadline',addDays(c.priority==='critical'?10:30))+`<div class="note">این سند به نام ${esc(engine.user.name)} مستقل از نظر مشاور ثبت می‌شود. برای ارجاع اختیاری، ابتدا از تب نظر و تصمیم استفاده کنید.</div>`;break;case 14:html=field('شماره نامه یکتا','no')+area('موضوع و متن ابلاغ','subject')+`<div class="note">مخاطب: شرکت ${esc(companyName(c.subsidiary))}؛ ارسال در کارتابل محلی ثبت می‌شود، نه در سامانه مکاتبات بیرونی.</div>`;break;case 15:html=area('پاسخ شرکت','summary')+area('گزارش تحلیلی ارائه‌شده به معاونت','presentation')+filesField()+`<div class="note">پیش‌نیاز: تحلیل مستقل پنج چرا در تب تحلیل شرکت تکمیل شده باشد.</div>`;break;case 16:html=area('جمع‌بندی اقدام اصلاحی','note')+`<div class="note">اقدامات را ابتدا در تب اقدام اصلاحی ایجاد و تا وضعیت «ارائه‌شده» پیش ببرید؛ برای ارائه اقدام پیوست لازم است.</div>`;break;case 17:html=area
